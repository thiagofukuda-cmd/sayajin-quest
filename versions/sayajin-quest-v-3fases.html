          for (const m of this.minions) this._updateEnemyMovement(m, dt, now);
          this._updateBossAI(now);
          this._updateChest(now);
          this._updateTemple(now);
          this._updateHealingShrine(now);
          this._updateSign(now);
          this._updateFlyChest(now);
          this._updateFase8Pizzas(now);
          this._updateCamera(now);
          this._updateCatSummon(now);
          this._updatePortal(now);
          this._updateStageProgress(now);
          this._updatePoisonEffects(now);
          this._updatePendingFlyHits(now);
        }
        this._updateProjectiles(now);

        this.netSendAccumulator += dt;
        if (this.netSendAccumulator > 1 / 20) { this.netSendAccumulator = 0; this._broadcastState(); }
      } else if (this.mode === 'client') {
        const kb = this._keyboardVector(this.localKey);
        let dx = (this.joystick ? this.joystick.dx : 0) + kb.dx;
        let dy = (this.joystick ? this.joystick.dy : 0) + kb.dy;
        const mag = Math.sqrt(dx * dx + dy * dy);
        if (mag > 1) { dx /= mag; dy /= mag; }
        this.netSendAccumulator += dt;
        if (this.netSendAccumulator > 1 / 20) {
          this.netSendAccumulator = 0;
          this.net.send({ t: 'input', dx, dy });
        }
      }
    }

    _updateLocalPlayer(character, joystick, dt, charKey, now) {
      const kb = this._keyboardVector(charKey);
      let dx = joystick.dx + kb.dx, dy = joystick.dy + kb.dy;
      const mag = Math.sqrt(dx * dx + dy * dy);
      if (mag > 1) { dx /= mag; dy /= mag; }
      const locked = character.isAttackLocked(now) || character.isStunned(now);
      character.setMoving(!locked && (dx !== 0 || dy !== 0));
      if (!locked) character.move(dx, dy, dt);
      character.updateTimers(dt);
    }

    _clampCharacters() {
      for (const c of [this.miguel, this.tiago]) {
        c.x = clamp(c.x, 20, this.width - 20);
        c.y = clamp(c.y, 10, this.groundTop - 10);
      }
    }

    _updateBossAI(now) {
      this._updateEnemyAttack(this.boss, now);
      for (const m of this.minions) this._updateEnemyAttack(m, now);

      const bossBlinded = [this.miguel, this.tiago].some((c) => c.tempoPowerType === 'blind');
      const bossControlled = now < (this.boss.attackDisabledUntil || -1);
      if (!this.boss.isDefeated && !bossBlinded && !bossControlled && this.boss.config.hasRockThrow) {
        if (now - this.lastRockThrowTime >= this.boss.config.rockThrowInterval) {
          this.lastRockThrowTime = now;
          this._fireBossRock(now);
        }
      }
      if (!this.boss.isDefeated && !bossBlinded && !bossControlled && this.boss.config.hasFishAttack) {
        if (now - this.lastFishThrowTime >= this.boss.config.fishAttackInterval) {
          this.lastFishThrowTime = now;
          this._fireBossFish(now);
        }
      }
      if (!this.boss.isDefeated && !bossBlinded && !bossControlled && this.boss.config.hasPlaqueThrow) {
        if (now - this.lastPlaqueThrowTime >= this.boss.config.plaqueThrowInterval) {
          this.lastPlaqueThrowTime = now;
          this._fireBossPlaque(now);
        }
      }
    }

    _updateEnemyAttack(enemy, now) {
      if (enemy.isDefeated) return;
      if (now < (enemy.attackDisabledUntil || -1)) { enemy.lastAttackTime = now; return; }
      const interval = enemy.config.attackInterval * (now < (enemy.slowedUntil || -1) ? 1.8 : 1);
      if (now - enemy.lastAttackTime < interval) return;
      enemy.lastAttackTime = now;

      if (enemy === this.boss && [this.miguel, this.tiago].some((c) => c.tempoPowerType === 'blind')) return;

      const dmgMul = (now < (enemy.weakenedUntil || -1)) ? (enemy.damageMultiplier || 1) : 1;
      let attacked = false;
      for (const c of [this.miguel, this.tiago]) {
        if (c.tempoPowerType === 'invisible') continue;
        if (c.immuneTimer > 0) continue;
        if (!c.isDefeated && dist(c.x, c.y, enemy.x, enemy.y) <= enemy.config.attackRange) {
          c.takeDamage(Math.max(1, Math.round(enemy.config.attackDamage * dmgMul)), now);
          this.audio.playHitImpact();
          attacked = true;
          if (enemy.config.stunDuration) { c.stunStartT = now; c.stunDuration = enemy.config.stunDuration; }
        }
      }
      if (attacked) enemy.playAttackLunge(now);
    }

    _updateEnemyMovement(enemy, dt, now) {
      if (enemy.isDefeated) return;
      if (now !== undefined && now < (enemy.attackDisabledUntil || -1)) return;
      const targets = [this.miguel, this.tiago].filter((c) => !c.isDefeated);
      if (!targets.length) return;
      let nearest = targets[0];
      let nd = dist(enemy.x, enemy.y, nearest.x, nearest.y);
      for (const c of targets) {
        const d = dist(enemy.x, enemy.y, c.x, c.y);
        if (d < nd) { nd = d; nearest = c; }
      }
      const stopDist = enemy.config.attackRange * 0.7;
      if (nd > stopDist) {
        const dx = nearest.x - enemy.x, dy = nearest.y - enemy.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const speed = (enemy.config.moveSpeed || 25) * (performance.now() / 1000 < (enemy.slowedUntil || -1) ? 0.4 : 1);
        enemy.x += (dx / len) * speed * dt;
        enemy.y += (dy / len) * speed * dt;
        enemy.x = clamp(enemy.x, 40, this.width - 40);
        enemy.y = clamp(enemy.y, this.groundTop * 0.35, this.groundTop - 20);
      }
    }

    _fireBossRock(now) {
      const targets = [this.miguel, this.tiago].filter((c) => !c.isDefeated && c.tempoPowerType !== 'invisible');
      if (!targets.length) return;
      const target = targets[Math.floor(Math.random() * targets.length)];
      this.projectiles.push({
        id: this._nextProjectileId++,
        kind: this.boss.config.rockThrowKind || 'rock',
        ownerKey: 'boss',
        targetCharKey: target.configKey,
        fromX: this.boss.x, fromY: this.boss.y + 40,
        toX: target.x, toY: target.y + 20,
        duration: 0.5,
        damage: this.boss.config.rockThrowDamage,
        applied: false,
        localStartT: now
      });
      this.boss.playAttackLunge(now);
    }

    _fireBossFish(now) {
      const targets = [this.miguel, this.tiago].filter((c) => !c.isDefeated && c.tempoPowerType !== 'invisible');
      if (!targets.length) return;
      const target = targets[Math.floor(Math.random() * targets.length)];
      this.projectiles.push({
        id: this._nextProjectileId++,
        kind: 'fish',
        ownerKey: 'boss',
        targetCharKey: target.configKey,
        fromX: this.boss.x, fromY: this.boss.y + 50,
        toX: target.x, toY: target.y + 20,
        duration: 0.55,
        damage: null,
        applied: false,
        localStartT: now
      });
      this.boss.playAttackLunge(now);
    }

    _fireBossPlaque(now) {
      const targets = [this.miguel, this.tiago].filter((c) => !c.isDefeated && c.tempoPowerType !== 'invisible');
      if (!targets.length) return;
      const target = targets[Math.floor(Math.random() * targets.length)];
      const lowHealth = this.boss.healthFraction < 0.3;
      const tiers = lowHealth
        ? ['plaqueSilver', 'plaqueBronze', 'plaqueGold', 'plaqueDiamond']
        : ['plaqueSilver', 'plaqueBronze', 'plaqueGold'];
      const kind = tiers[Math.floor(Math.random() * tiers.length)];
      this.projectiles.push({
        id: this._nextProjectileId++,
        kind,
        ownerKey: 'boss',
        targetCharKey: target.configKey,
        fromX: this.boss.x, fromY: this.boss.y + 40,
        toX: target.x, toY: target.y + 20,
        duration: 0.5,
        damage: null,
        applied: false,
        localStartT: now
      });
      this.boss.playAttackLunge(now);
    }

    _updateChest(now) {
      if (!this.chest || this.chest.opened) return;
      for (const c of [this.miguel, this.tiago]) {
        if (dist(c.x, c.y, this.chest.x, this.chest.y) < 34) {
          this.chest.opened = true;
          this.miguel.grantSpecialPower();
          this.tiago.grantSpecialPower();
          for (const cc of [this.miguel, this.tiago]) {
            if (cc.configKey === 'kai') cc.grantGiftPower();
            if (cc.configKey === 'ester') cc.grantPizzaPower();
          }
          this.audio.playVictoryJingle();
          this._showBanner('Baú aberto! Poder especial desbloqueado', '#FFD933');
          break;
        }
      }
    }

    _updateTemple(now) {
      if (!this.temple || this.temple.activated) return;
      for (const c of [this.miguel, this.tiago]) {
        if (dist(c.x, c.y, this.temple.x, this.temple.y) < 50) {
          this.temple.activated = true;
          this.miguel.grantEnergyBlast();
          this.tiago.grantEnergyBlast();
          this.audio.playVictoryJingle();
          this._showBanner('Templo ativado! Golpe de energia desbloqueado', '#8FD1FF');
          break;
        }
      }
    }

    _updateHealingShrine(now) {
      if (!this.healingShrine || this.healingShrine.activated) return;
      for (const c of [this.miguel, this.tiago]) {
        if (dist(c.x, c.y, this.healingShrine.x, this.healingShrine.y) < 50) {
          this.healingShrine.activated = true;
          this.miguel.grantHeal();
          this.tiago.grantHeal();
          this.audio.playVictoryJingle();
          this._showBanner('Fonte de cura ativada! Poder de cura desbloqueado', '#8FE0A0');
          break;
        }
      }
    }

    _updateSign(now) {
      if (!this.sign || this.sign.activated) return;
      for (const c of [this.miguel, this.tiago]) {
        if (dist(c.x, c.y, this.sign.x, this.sign.y) < 50) {
          this.sign.activated = true;
          this.miguel.grantWaterGun();
          this.tiago.grantWaterGun();
          this.audio.playVictoryJingle();
          this._showBanner('Placa ativada! Arminha de água desbloqueada', '#BFE0FF');
          break;
        }
      }
    }

    _updateFlyChest(now) {
      if (!this.flyChest || this.flyChest.opened) return;
      for (const c of [this.miguel, this.tiago]) {
        if (dist(c.x, c.y, this.flyChest.x, this.flyChest.y) < 34) {
          this.flyChest.opened = true;
          this.miguel.grantFlyAttack();
          this.tiago.grantFlyAttack();
          this.audio.playVictoryJingle();
          this._showBanner('Baú do voo aberto! Ataque voador desbloqueado', '#FFB428');
          break;
        }
      }
    }

    _updateCamera(now) {
      if (!this.camera || this.camera.opened) return;
      for (const c of [this.miguel, this.tiago]) {
        if (dist(c.x, c.y, this.camera.x, this.camera.y) < 34) {
          this.camera.opened = true;
          this.miguel.grantVideoFreeze();
          this.tiago.grantVideoFreeze();
          this.audio.playVictoryJingle();
          this._showBanner('📹 Câmera pega! Grave um vídeo para congelar o inimigo', '#FF4A6A');
          break;
        }
      }
    }

    _updateFase8Pizzas(now) {
      if (!this.fase8Pizzas || !this.fase8Pizzas.length) return;
      for (const item of this.fase8Pizzas) {
        if (item.opened) continue;
        for (const c of [this.miguel, this.tiago]) {
          if (dist(c.x, c.y, item.x, item.y) < 30) {
            item.opened = true;
            this.miguel.foodLevel = 3; this.tiago.foodLevel = 3;
            this.miguel.grantPushAttack(); this.tiago.grantPushAttack();
            this.audio.playHealChime();
            this._showBanner('🍕 Pizza! Super velocidade + ataque de empurrar desbloqueado!', '#FFB627');
            break;
          }
        }
      }
    }

    _updateCatSummon(now) {
      const summoner = [this.miguel, this.tiago].find((c) => c.configKey === 'miguel' && c.catActive);
      if (!summoner) return;
      if (this.miguel.isDefeated || this.tiago.isDefeated) {
        summoner.catActive = false;
        return;
      }
      if (now >= this.catNextTick) {
        this.catNextTick = now + 2;
        const target = this._nearestEnemyTarget();
        if (target) {
          target.takeDamage(Math.round(16 * GLOBAL_DAMAGE_MULTIPLIER), now);
          this.audio.playHitImpact();
        }
      }
    }

    _updatePortal(now) {
      if (!this.portal || this.inTempo) return;
      for (const c of [this.miguel, this.tiago]) {
        if (dist(c.x, c.y, this.portal.x, this.portal.y) < 40) {
          this._enterTempo(now);
          break;
        }
      }
    }

    _enterTempo(now) {
      const cfg = PORTAL_CONFIGS.find((p) => p.stageIndex === this.stageIndex);
      if (!cfg) return;
      this.inTempo = true;
      this.tempoConfig = cfg;
      if (cfg.multiItem) {
        this.tempoPizza = { x: this.width * 0.32, y: this.groundTop * 0.5, opened: false };
        this.tempoWaterCup = { x: this.width * 0.5, y: this.groundTop * 0.5, opened: false };
        this.tempoChest = { x: this.width * 0.68, y: this.groundTop * 0.5, opened: false };
      } else {
        this.tempoChest = { x: this.width * 0.5, y: this.groundTop * 0.5, opened: false };
        this.tempoPizza = null;
        this.tempoWaterCup = null;
      }
      this._placeCharacters();
      this._showBanner(cfg.name, '#B98CFF');
    }

    _exitTempo() {
      this.inTempo = false;
      this.tempoConfig = null;
      this.tempoChest = null;
      this.tempoPizza = null;
      this.tempoWaterCup = null;
      this._placeCharacters();
    }

    _updateTempoChest(now) {
      if (!this.inTempo) return;
      if (this.tempoConfig && this.tempoConfig.multiItem) { this._updateTempoMultiItems(now); return; }
      if (!this.tempoChest || this.tempoChest.opened) return;
      for (const c of [this.miguel, this.tiago]) {
        if (dist(c.x, c.y, this.tempoChest.x, this.tempoChest.y) < 34) {
          this.tempoChest.opened = true;
          const cfg = this.tempoConfig;
          this._grantPortalPower(cfg, now);
          this._exitTempo();
          if (cfg.permanent) {
            this._showBanner('Poder permanente desbloqueado!', '#BFE0FF');
          } else {
            this._showBanner(`Poder temporário ativado por ${TEMPO_POWER_DURATION}s!`, '#B98CFF');
          }
          break;
        }
      }
    }

    _updateTempoMultiItems(now) {
      if (this.tempoPizza && !this.tempoPizza.opened) {
        for (const c of [this.miguel, this.tiago]) {
          if (dist(c.x, c.y, this.tempoPizza.x, this.tempoPizza.y) < 30) {
            this.tempoPizza.opened = true;
            this.miguel.foodLevel = 3; this.tiago.foodLevel = 3;
            this.audio.playHealChime();
            this._showBanner('🍕 Pizza! Velocidade máxima!', '#FFE066');
            break;
          }
        }
      }
      if (this.tempoWaterCup && !this.tempoWaterCup.opened) {
        for (const c of [this.miguel, this.tiago]) {
          if (dist(c.x, c.y, this.tempoWaterCup.x, this.tempoWaterCup.y) < 30) {
            this.tempoWaterCup.opened = true;
            this.miguel.waterLevel = 3; this.tiago.waterLevel = 3;
            this.audio.playWaterBlip();
            this._showBanner('💧 Água! Dano dobrado em todos os ataques!', '#4FA8E0');
            break;
          }
        }
      }
      if (this.tempoChest && !this.tempoChest.opened) {
        for (const c of [this.miguel, this.tiago]) {
          if (dist(c.x, c.y, this.tempoChest.x, this.tempoChest.y) < 34) {
            this.tempoChest.opened = true;
            this.boss.weakenedUntil = now + DEFAULT_POWER_DURATION;
            this.boss.damageMultiplier = 0.1;
            this.audio.playVictoryJingle();
            this._showBanner('🍀 O chefe ficou muito fraco!', '#BFE0FF');
            break;
          }
        }
      }
      if (this.tempoPizza.opened && this.tempoWaterCup.opened && this.tempoChest.opened) {
        this._exitTempo();
      }
    }

    _grantPortalPower(cfg, now) {
      for (const c of [this.miguel, this.tiago]) {
        if (cfg.permanent) {
          if (cfg.powerType === 'ice') c.grantIceAttack();
          else if (cfg.powerType === 'speedPizza') {
            c.foodLevel = 3;
            if (c.configKey === 'miguel') c.grantYellowBall();
            if (c.configKey === 'tiago') c.hasSpinAttack = true;
          }
          else if (cfg.powerType === 'pianoControl') c.grantBossControl();
        } else {
          c.grantTempoPower(cfg.powerType);
        }
      }
      if (cfg.powerType === 'pianoControl' && this.boss && !this.boss.isDefeated) {
        const t = now !== undefined ? now : performance.now() / 1000;
        this.boss.weakenedUntil = t + 99999;
        this.boss.damageMultiplier = 0.5;
        this.boss.slowedUntil = t + 99999;
        this._cycleMusic();
      }
      this.audio.playVictoryJingle();
    }

    _handleTempoAction(character, now) {
      if (!character.canUseTempoAction()) return;
      const type = character.tempoPowerType;
      if (type === 'halfLife') {
        const target = this._nearestEnemyTarget();
        if (!target) return;
        character.tempoActionCooldown = 5.0;
        character.attackAnimT = now;
        this.audio.playSpecialBlip();
        target.takeDamage(Math.max(1, Math.round(target.health / 2)), now);
      } else if (type === 'fire') {
        character.tempoActionCooldown = 1.5;
        character.attackAnimT = now;
        this.audio.playBlastBlip();
        const target = this._nearestEnemyTarget();
        this.projectiles.push({
          id: this._nextProjectileId++,
          kind: 'fire',
          ownerKey: character.configKey,
          fromX: character.x, fromY: character.y + 34,
          toX: target ? target.x : this.boss.x, toY: target ? target.y + 10 : this.boss.y + 10,
          duration: 0.4,
          damage: 25,
          applied: false,
          localStartT: now
        });
      } else if (type === 'poison') {
        character.tempoActionCooldown = 10.0;
        character.attackAnimT = now;
        this.audio.playSpecialBlip();
        const target = this._nearestEnemyTarget();
        if (target) {
          this.poisonEffects.push({ target, ticksLeft: 3, nextTick: now + 5, damage: 10 });
          this._showBanner('🌸 Fôlego Rosa aplicado!', '#FF6FC4');
        }
      }
      // 'invisible' and 'blind' are passive effects — no action to trigger.
    }

    _updatePoisonEffects(now) {
      for (const eff of this.poisonEffects) {
        if (eff.ticksLeft > 0 && now >= eff.nextTick) {
          if (!eff.target.isDefeated) {
            eff.target.takeDamage(eff.damage, now);
            this.audio.playHitImpact();
          }
          eff.ticksLeft--;
          eff.nextTick += 5;
        }
      }
      this.poisonEffects = this.poisonEffects.filter((e) => e.ticksLeft > 0);
    }

    _handleGift(character, now) {
      if (!character.canUseGift()) return;
      character.useGift();
      this.audio.playVictoryJingle();
      this._showBanner('🎅 Presente de Natal! Pulando de fase...', '#FF4444');
      this._advanceStage();
    }

    _handlePizza(character, now) {
      if (!character.canUsePizza()) return;
      character.performPizza(now);
      this.audio.playHealChime();
      this.miguel.health = Math.min(this.miguel.maxHealth, this.miguel.health + 25 * GLOBAL_HEAL_MULTIPLIER);
      this.tiago.health = Math.min(this.tiago.maxHealth, this.tiago.health + 25 * GLOBAL_HEAL_MULTIPLIER);
      this._showBanner('🍕 Chuva de pizza! Vida recuperada', '#FFB627');
    }

    _handleSlow(character, now) {
      if (!character.canUseSlow()) return;
      character.performSlowAttack(now);
      this.audio.playSpecialBlip();
      const target = this._nearestEnemyTarget();
      if (target) target.slowedUntil = now + 6;
      this._showBanner('🐌 Inimigo desacelerado!', '#7CFF9C');
    }

    _handleTeamHeal(character, now) {
      if (!character.canUseTeamHeal()) return;
      character.performTeamHeal(now);
      this.audio.playHealChime();
      this.miguel.health = Math.min(this.miguel.maxHealth, this.miguel.health + 30 * GLOBAL_HEAL_MULTIPLIER);
      this.tiago.health = Math.min(this.tiago.maxHealth, this.tiago.health + 30 * GLOBAL_HEAL_MULTIPLIER);
      this._showBanner('💚 Cura em equipe!', '#8FE0A0');
    }

    _handleIce(character, now) {
      if (!character.canUseIce()) return;
      const damage = character.performIceAttack(now);
      this.audio.playWaterBlip();
      const target = this._nearestEnemyTarget();
      this.projectiles.push({
        id: this._nextProjectileId++,
        kind: 'ice',
        ownerKey: character.configKey,
        fromX: character.x, fromY: character.y + 34,
        toX: target ? target.x : this.boss.x, toY: target ? target.y + 10 : this.boss.y + 10,
        duration: 0.4,
        damage,
        applied: false,
        localStartT: now
      });
    }

    // -- fase 7/8 extra character powers -------------------------------

    _handleCatSummon(character, now) {
      if (!character.canUseCatSummon()) return;
      character.performCatSummon(now);
      this.audio.playPowerBlip();
      this._showBanner('🐱 Gato invocado! Ele fica arranhando o inimigo', '#E6963C');
    }

    _handleYellowBall(character, now) {
      if (!character.canUseYellowBall()) return;
      const damage = character.performYellowBall(now);
      this.audio.playBlastBlip();
      const target = this._nearestEnemyTarget();
      this.projectiles.push({
        id: this._nextProjectileId++,
        kind: 'yellowball',
        ownerKey: character.configKey,
        fromX: character.x, fromY: character.y + 34,
        toX: target ? target.x : this.boss.x, toY: target ? target.y + 10 : this.boss.y + 10,
        duration: 0.4,
        damage,
        applied: false,
        localStartT: now
      });
    }

    _handleSpinAttack(character, now) {
      if (!character.canUseSpinAttack()) return;
      character.performSpinAttack(now);
      this.audio.playSpecialBlip();
      const target = this._nearestEnemyTarget();
      if (target) target.attackDisabledUntil = now + 5;
      this._showBanner('🌀 Inimigo girando, sem conseguir atacar!', '#78B4FF');
    }

    _handleWeakenSelf(character, now) {
      if (!character.canUseWeakenSelf()) return;
      character.performWeakenSelf(now);
      this.audio.playSpecialBlip();
      this._showBanner('🛡️ Os chefes quase não conseguem te machucar!', '#96969F');
    }

    _handleTigerBlind(character, now) {
      if (!character.canUseTigerBlind()) return;
      character.performTigerBlind(now);
      this.audio.playSpecialBlip();
      const target = this._nearestEnemyTarget();
      if (target) target.attackDisabledUntil = now + 10;
      this._showBanner('🐯 Tigre agarrado no olho do chefe!', '#E68C14');
    }

    _handleSpeedBurst(character, now) {
      if (!character.canUseSpeedBurst()) return;
      character.performSpeedBurst(now);
      this.audio.playPowerBlip();
      this._showBanner('💨 Super velocidade ativada!', '#8CDCFF');
    }

    _handleFlyDebuff(character, now) {
      if (!character.canUseFlyDebuff()) return;
      character.performFlyDebuff(now);
      this.audio.playSpecialBlip();
      const target = this._nearestEnemyTarget();
      if (target) target.attackDisabledUntil = now + DEFAULT_POWER_DURATION;
      this._showBanner('🕊️ O chefe está voando e não consegue atacar direito!', '#FF96C8');
    }

    _handleFase8Shield(character, now) {
      if (this.stageIndex !== DARK_STAGE_INDEX) return;
      if (!character.canUseFase8Shield()) return;
      character.performFase8Shield(now);
      this.audio.playPowerBlip();
      this._showBanner('✋ O chefe não consegue mais te atacar!', '#C864DC');
    }

    _handlePuzzleWhirl(character, now) {
      if (!character.canUsePuzzleWhirl()) return;
      character.performPuzzleWhirl(now);
      this.audio.playSpecialBlip();
      const target = this._nearestEnemyTarget();
      if (target) target.attackDisabledUntil = now + DEFAULT_POWER_DURATION;
      this._showBanner('🧩 O chefe está girando ao redor dela, sem atacar!', '#B4DC64');
    }

    _handleSaberThrow(character, now) {
      if (!character.canUseSaberThrow()) return;
      const damage = character.performSaberThrow(now);
      this.audio.playBlastBlip();
      const target = this._nearestEnemyTarget();
      const saberColor = character.currentForm.saberColor === 'red' ? 'red' : 'blue';
      this.projectiles.push({
        id: this._nextProjectileId++,
        kind: 'saberthrow',
        ownerKey: character.configKey,
        saberColor,
        fromX: character.x, fromY: character.y + 34,
        toX: target ? target.x : this.boss.x, toY: target ? target.y + 10 : this.boss.y + 10,
        duration: 0.35,
        damage,
        applied: false,
        localStartT: now
      });
    }

    _handleVaderFreeze(character, now) {
      if (!character.canUseVaderFreeze()) return;
      character.performVaderFreeze(now);
      this.audio.playSpecialBlip();
      const target = this._nearestEnemyTarget();
      if (target) target.attackDisabledUntil = now + 5;
      this._showBanner('🥶 O chefe ficou paralisado!', '#D93030');
    }

    _handlePush(character, now) {
      if (!character.canUsePush()) return;
      const damage = character.performPush(now);
      this.audio.playBlastBlip();
      const target = this._nearestEnemyTarget();
      if (target) {
        target.attackDisabledUntil = now + 3;
        if (dist(character.x, character.y, target.x, target.y) <= target.config.attackRange + 40) {
          target.takeDamage(damage, now);
        }
      }
      this._showBanner('👊 Chefe empurrado!', '#FFB627');
    }

    _handleBossControl(character, now) {
      if (!character.canUseBossControl()) return;
      if (!(this.stageIndex === WORLD2_PIANO_INDEX || this.stageIndex === WORLD2_YOUTUBE_INDEX)) return;
      character.performBossControl(now);
      this.audio.playSpecialBlip();
      if (this.boss && !this.boss.isDefeated) this.boss.attackDisabledUntil = now + BOSS_CONTROL_DURATION;
      this._showBanner('🎹 Você está controlando o chefe!', '#B98CFF');
    }

    _handleVideoFreeze(character, now) {
      if (!character.canUseVideoFreeze()) return;
      if (!(this.stageIndex === WORLD2_YOUTUBE_INDEX || this._youtubePowerUnlocked)) return;
      character.performVideoFreeze(now);
      this.audio.playSpecialBlip();
      if (this.boss && !this.boss.isDefeated) this.boss.attackDisabledUntil = now + VIDEO_FREEZE_DURATION;
      for (const m of this.minions) if (!m.isDefeated) m.attackDisabledUntil = now + VIDEO_FREEZE_DURATION;
      this._showBanner('📹 Vídeo gravado! O inimigo está congelado', '#FF4A6A');
    }

    _plaqueDamage(kind, c) {
      if (kind === 'plaqueSilver') return Math.max(1, Math.round(c.maxHealth / 4));
      if (kind === 'plaqueBronze') return Math.max(1, Math.round(c.maxHealth / 10));
      if (kind === 'plaqueGold') return Math.max(1, Math.round(c.maxHealth / 2));
      if (kind === 'plaqueDiamond') return c.health > 1 ? c.health - 1 : c.health;
      return 0;
    }

    _updateProjectiles(now) {
      const dynamicKinds = ['rock', 'snowball', 'fish', 'shadowball', 'horn', 'pianokey', 'plaqueSilver', 'plaqueBronze', 'plaqueGold', 'plaqueDiamond'];
      for (const p of this.projectiles) {
        if (!p.applied && now - p.localStartT >= p.duration) {
          p.applied = true;
          if (dynamicKinds.includes(p.kind)) {
            const c = this._characterFor(p.targetCharKey);
            if (c && !c.isDefeated && c.immuneTimer <= 0) {
              const dmgMul = (now < (this.boss.weakenedUntil || -1)) ? (this.boss.damageMultiplier || 1) : 1;
              let dmg;
              if (p.kind === 'fish') dmg = Math.max(1, Math.round(c.maxHealth / 4 * dmgMul));
              else if (p.kind.indexOf('plaque') === 0) dmg = Math.max(1, Math.round(this._plaqueDamage(p.kind, c) * dmgMul));
              else dmg = Math.max(1, Math.round(p.damage * dmgMul));
              c.takeDamage(dmg, now);
              this.audio.playHitImpact();
            }
          } else {
            const target = this._nearestEnemyTarget();
            if (target) {
              target.takeDamage(p.damage, now);
              this.audio.playHitImpact();
            }
          }
        }
      }
      this.projectiles = this.projectiles.filter((p) => now - p.localStartT < p.duration + 0.15);
    }

    _updateStageProgress(now) {
      if (this.miguel.isDefeated || this.tiago.isDefeated) this.noDeathSoFar = false;
      if (this.isGameComplete) return;
      if (this.boss.isDefeated) {
        if (this.stageIndex === CAT_UNLOCK_STAGE_INDEX && this.noDeathSoFar && !this.catRewardGiven) {
          this.catRewardGiven = true;
          for (const c of [this.miguel, this.tiago]) if (c.configKey === 'miguel') c.grantCatSummon();
          this.audio.playVictoryJingle();
          this._showBanner('🐱 Um gato voador apareceu! Gato do Miguel liberado!', '#E6963C');
        }
        if (this.bossDefeatedAt === null) {
          this.bossDefeatedAt = now;
          if (this.stageIndex === DARK_STAGE_INDEX) {
            const portalChar = [this.miguel, this.tiago].find((c) => c.configKey === 'miguel')
              || [this.miguel, this.tiago].find((c) => c.configKey === 'tiago') || this.miguel;
            this._showBanner(`🌀 ${portalChar.config.shortName} abre um portal para o Mundo 2!`, '#B98CFF');
          }
        } else {
          const delay = this.stageIndex === DARK_STAGE_INDEX ? 4.0 : 2.5;
          if (now - this.bossDefeatedAt > delay) { this.bossDefeatedAt = null; this._advanceStage(); }
        }
      }
    }

    // -- rendering --------------------------------------------------------

    _render(now) {
      if (this.inTempo) { this._renderTempo(now); return; }
      const ctx = this.ctx, W = this.width, H = this.height;
      const tod = TIME_OF_DAY[this.biome.timeOfDay];

      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, tod.skyTop);
      grad.addColorStop(1, tod.skyBottom);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      const sunX = W * 0.78, sunY = H * 0.22;
      const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, tod.sunGlowR * 1.6);
      glow.addColorStop(0, rgba(tod.sun, 0.55));
      glow.addColorStop(1, rgba(tod.sun, 0));
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(sunX, sunY, tod.sunGlowR * 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = tod.sun;
      ctx.beginPath(); ctx.arc(sunX, sunY, tod.sunR, 0, Math.PI * 2); ctx.fill();

      if (tod.decor === 'clouds') this._drawClouds(ctx, now, W, H);
      else if (tod.decor === 'stars') this._drawStars(ctx, now, W, H);
      else if (tod.decor === 'embers') this._drawEmbers(ctx, now, W, H);
      else if (tod.decor === 'voidstars') this._drawVoidStars(ctx, now, W, H);
      else if (tod.decor === 'snowfall') this._drawSnowfall(ctx, now, W, H);

      this._drawHills(ctx, H);
      this._drawGround(ctx, H);

      const entities = [];
      for (const t of this._grassTufts) entities.push({ y: t.y, draw: () => this._drawGrassBlade(ctx, t, H) });
      for (const tr of this._trees) entities.push({ y: tr.y, draw: () => this._drawTree(ctx, tr, H) });
      if (this.chest && !this.chest.opened) entities.push({ y: this.chest.y, draw: () => drawChest(ctx, this.chest, H) });
      if (this.temple) entities.push({ y: this.temple.y, draw: () => drawTemple(ctx, this.temple, H) });
      if (this.healingShrine) entities.push({ y: this.healingShrine.y, draw: () => drawHealingShrine(ctx, this.healingShrine, H) });
      if (this.sign) entities.push({ y: this.sign.y, draw: () => drawSign(ctx, this.sign, H) });
      if (this.flyChest && !this.flyChest.opened) entities.push({ y: this.flyChest.y, draw: () => drawChest(ctx, this.flyChest, H) });
      for (const item of this.fase8Pizzas) if (!item.opened) entities.push({ y: item.y, draw: () => drawPizzaItem(ctx, item, H) });
      if (this.camera && !this.camera.opened) entities.push({ y: this.camera.y, draw: () => drawCameraItem(ctx, this.camera, H) });
      if (this.portal) entities.push({ y: this.portal.y, draw: () => drawPortal(ctx, this.portal, H) });
      for (const m of this.minions) entities.push({ y: m.y, draw: () => m.draw(ctx, now, H) });
      entities.push({ y: this.boss.y, draw: () => this.boss.draw(ctx, now, H) });
      entities.push({ y: this.miguel.y, draw: () => this.miguel.draw(ctx, now, H) });
      entities.push({ y: this.tiago.y, draw: () => this.tiago.draw(ctx, now, H) });
      const catOwner = [this.miguel, this.tiago].find((c) => c.configKey === 'miguel' && c.catActive);
      if (catOwner) entities.push({ y: catOwner.y - 5, draw: () => drawCatCompanion(ctx, catOwner, now, H) });
      entities.sort((a, b) => b.y - a.y);
      for (const e of entities) e.draw();

      if (this.stageIndex === DARK_STAGE_INDEX && this.boss.isDefeated && this.bossDefeatedAt !== null) {
        this._drawWorldPortalEffect(ctx, W, H, now);
      }

      this._drawProjectiles(ctx, now, H);
      this._drawHUD(ctx, W, H, now);
      if (this.isGameComplete) this._drawVictoryScreen(ctx, W, H, now);
      if (this.animalSelectPending) this._drawAnimalSelectOverlay(ctx, W, H, now);
    }

    _drawWorldPortalEffect(ctx, W, H, now) {
      const portalChar = [this.miguel, this.tiago].find((c) => c.configKey === 'miguel')
        || [this.miguel, this.tiago].find((c) => c.configKey === 'tiago') || this.miguel;
      const cx = portalChar.x, cy = portalChar.y + 60;
      const screenX = cx, screenY = H - cy;
      ctx.save();
      ctx.translate(screenX, screenY);
      for (let i = 0; i < 3; i++) {
        const r = 30 + i * 16 + Math.sin(now * 3 + i) * 6;
        ctx.strokeStyle = `rgba(185,140,255,${0.55 - i * 0.15})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(0, 0, r, r * 0.4, now * 2 + i, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    _renderTempo(now) {
      const ctx = this.ctx, W = this.width, H = this.height;
      const cfg = this.tempoConfig || { name: 'Tempo' };
      const roomColor = cfg.permanent ? '#152838' : '#2A2430';
      ctx.fillStyle = roomColor;
      ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 16; i++) {
        const bw = W / 16;
        drawRoundedRectLocal(ctx, i * bw + bw / 2, H * 0.06, bw - 4, H * 0.1, 2, 0, shade(roomColor, i % 2 === 0 ? 1.3 : 1.1));
        drawRoundedRectLocal(ctx, i * bw + bw / 2, H - H * 0.06, bw - 4, H * 0.1, 2, 0, shade(roomColor, i % 2 === 0 ? 1.3 : 1.1));
      }

      const singleItemDraw = cfg.itemVisual === 'pizza' ? drawPizzaItem : cfg.itemVisual === 'water' ? drawWaterItem : cfg.itemVisual === 'piano' ? drawPianoItem : drawChest;
      const entities = [];
      if (this.tempoChest && !this.tempoChest.opened) entities.push({ y: this.tempoChest.y, draw: () => singleItemDraw(ctx, this.tempoChest, H) });
      if (this.tempoPizza && !this.tempoPizza.opened) entities.push({ y: this.tempoPizza.y, draw: () => drawPizzaItem(ctx, this.tempoPizza, H) });
      if (this.tempoWaterCup && !this.tempoWaterCup.opened) entities.push({ y: this.tempoWaterCup.y, draw: () => drawWaterItem(ctx, this.tempoWaterCup, H) });
      entities.push({ y: this.miguel.y, draw: () => this.miguel.draw(ctx, now, H) });
      entities.push({ y: this.tiago.y, draw: () => this.tiago.draw(ctx, now, H) });
      entities.sort((a, b) => b.y - a.y);
      for (const e of entities) e.draw();

      ctx.save();
      ctx.font = 'bold 22px -apple-system, "Segoe UI", sans-serif';
      ctx.fillStyle = '#E0C8FF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText(cfg.name, W / 2, 40);
      ctx.fillText(cfg.name, W / 2, 40);
      ctx.font = '13px -apple-system, "Segoe UI", sans-serif';
      ctx.fillStyle = '#D9CCE8';
      const hint = cfg.multiItem ? 'Pegue a pizza, a água e o baú!' : cfg.itemVisual === 'pizza' ? 'Coma a pizza!' : cfg.itemVisual === 'water' ? 'Beba a água!' : cfg.itemVisual === 'piano' ? 'Toque o piano!' : 'Encontre o baú!';
      ctx.strokeText(hint, W / 2, 66);
      ctx.fillText(hint, W / 2, 66);
      ctx.restore();

      this._drawPlayerPanel(ctx, 20, 96, this.miguel, false);
      this._drawPlayerPanel(ctx, W - 20, 96, this.tiago, true);
      if (this.joystickMiguel) this.joystickMiguel.draw(ctx);
      if (this.joystickTiago) this.joystickTiago.draw(ctx);
      if (this.restartButton) this.restartButton.draw(ctx);
      this.musicButton.draw(ctx);

      const bt = now - this.banner.start;
      if (bt >= 0 && bt < this.banner.duration) {
        let alpha = 1;
        if (bt < 0.3) alpha = bt / 0.3;
        else if (bt > this.banner.duration - 0.5) alpha = (this.banner.duration - bt) / 0.5;
        ctx.save();
        ctx.globalAlpha = clamp(alpha, 0, 1);
        ctx.font = 'bold 24px -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = this.banner.color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.strokeText(this.banner.text, W / 2, H / 2);
        ctx.fillText(this.banner.text, W / 2, H / 2);
        ctx.restore();
      }
    }

    _drawVictoryScreen(ctx, W, H, now) {
      ctx.save();
      ctx.fillStyle = 'rgba(8,8,18,0.75)';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.font = 'bold 42px -apple-system, "Segoe UI", sans-serif';
      ctx.fillStyle = '#FFD933';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText('MUNDO 2 CONCLUÍDO! 🎉', W / 2, H * 0.35);
      ctx.fillText('MUNDO 2 CONCLUÍDO! 🎉', W / 2, H * 0.35);

      ctx.font = '18px -apple-system, "Segoe UI", sans-serif';
      ctx.fillStyle = '#EAEAEA';
      ctx.fillText('Mais fases do Mundo 2 chegando em breve...', W / 2, H * 0.35 + 44);

      if (this.mode === 'client') {
        this._victoryButtonBounds = null;
        ctx.font = '15px -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = '#BFD1FF';
        ctx.fillText('Aguardando o anfitrião reiniciar…', W / 2, H * 0.35 + 90);
      } else {
        const btnW = 220, btnH = 56;
        const btnX = W / 2 - btnW / 2, btnY = H * 0.35 + 76;
        this._victoryButtonBounds = { x: btnX, y: btnY, w: btnW, h: btnH };
        drawRoundedRectLocal(ctx, W / 2, btnY + btnH / 2, btnW, btnH, 16, 0, 'rgba(64,170,255,0.95)', '#FFFFFF', 2);
        ctx.font = 'bold 18px -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('JOGAR DE NOVO', W / 2, btnY + btnH / 2);
      }

      ctx.restore();
    }

    _drawAnimalSelectOverlay(ctx, W, H, now) {
      ctx.save();
      ctx.fillStyle = 'rgba(20,14,4,0.82)';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const isP1 = this.animalSelectStage === 'p1';
      const title = isP1 ? 'Jogador 1 — escolha seu animal' : 'Jogador 2 — escolha seu animal';
      ctx.font = 'bold 28px -apple-system, "Segoe UI", sans-serif';
      ctx.fillStyle = '#FFD933';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText(title, W / 2, H * 0.3);
      ctx.fillText(title, W / 2, H * 0.3);

      if (this.mode === 'client') {
        this._animalButtonBounds = null;
        ctx.font = '15px -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = '#E8D9B8';
        ctx.fillText('Aguardando o anfitrião escolher…', W / 2, H * 0.3 + 50);
      } else {
        const btnW = 160, btnH = 90, gap = 40;
        const totalW = btnW * 2 + gap;
        const startX = W / 2 - totalW / 2;
        const btnY = H * 0.3 + 50;
        const vacaBounds = { x: startX, y: btnY, w: btnW, h: btnH };
        const gatoBounds = { x: startX + btnW + gap, y: btnY, w: btnW, h: btnH };
        this._animalButtonBounds = { vaca: vacaBounds, gato: gatoBounds };

        drawRoundedRectLocal(ctx, vacaBounds.x + btnW / 2, btnY + btnH / 2, btnW, btnH, 16, 0, 'rgba(245,240,230,0.95)', '#8A7A50', 2);
        ctx.font = '38px -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = '#2A2A2A';
        ctx.fillText('🐄', vacaBounds.x + btnW / 2, btnY + 32);
        ctx.font = 'bold 16px -apple-system, "Segoe UI", sans-serif';
        ctx.fillText('Vaca', vacaBounds.x + btnW / 2, btnY + 66);

        drawRoundedRectLocal(ctx, gatoBounds.x + btnW / 2, btnY + btnH / 2, btnW, btnH, 16, 0, 'rgba(230,140,60,0.95)', '#8A5A1F', 2);
        ctx.font = '38px -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = '#2A1A0A';
        ctx.fillText('🐱', gatoBounds.x + btnW / 2, btnY + 32);
        ctx.font = 'bold 16px -apple-system, "Segoe UI", sans-serif';
        ctx.fillText('Gato', gatoBounds.x + btnW / 2, btnY + 66);

        ctx.font = '13px -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = '#E8D9B8';
        ctx.fillText('Vaca: muita vida, pouco dano   •   Gato: pouca vida, muito dano', W / 2, btnY + btnH + 30);
      }

      ctx.restore();
    }

    _drawProjectiles(ctx, now, H) {
      for (const p of this.projectiles) {
        const progress = clamp((now - p.localStartT) / p.duration, 0, 1);
        const x = p.fromX + (p.toX - p.fromX) * progress;
        const y = p.fromY + (p.toY - p.fromY) * progress;
        const screenY = H - y;
        ctx.save();
        ctx.translate(x, screenY);
        if (p.kind === 'rock') {
          ctx.rotate(now * 10);
          drawEllipseLocal(ctx, 0, 0, 12, 10, '#8A8A82', '#4A4A46', 2);
          drawEllipseLocal(ctx, -3, 2, 3, 2.5, '#6E6E68');
        } else if (p.kind === 'snowball') {
          ctx.rotate(now * 5);
          drawEllipseLocal(ctx, 0, 0, 12, 12, '#FFFFFF', '#C9D9E8', 2);
          drawEllipseLocal(ctx, -3, 2, 3, 3, '#E8F0F8');
        } else if (p.kind === 'water') {
          ctx.rotate(now * 6);
          drawEllipseLocal(ctx, 0, 0, 14, 14, 'rgba(64,150,255,0.35)');
          drawEllipseLocal(ctx, 0, 0, 7, 7, '#BFE0FF', '#FFFFFF', 1.5);
        } else if (p.kind === 'fire') {
          ctx.rotate(now * 7);
          drawEllipseLocal(ctx, 0, 0, 14, 14, 'rgba(255,120,30,0.35)');
          drawEllipseLocal(ctx, 0, 0, 7, 9, '#FFB040', '#FF6A1A', 1.5);
        } else if (p.kind === 'ice') {
          ctx.rotate(now * 6);
          drawEllipseLocal(ctx, 0, 0, 13, 13, 'rgba(140,210,255,0.35)');
          polygonPath(ctx, [[0, 10], [-6, -2], [0, -10], [6, -2]]);
          ctx.fillStyle = '#CFEFFF';
          ctx.fill();
          ctx.strokeStyle = '#8FD1FF';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else if (p.kind === 'fish') {
          ctx.rotate(Math.sin(now * 6) * 0.3);
          drawEllipseLocal(ctx, 0, 0, 11, 6, '#BFC9E8', '#7B87B8', 1.5);
          polygonPath(ctx, [[-11, 0], [-18, 5], [-18, -5]]);
          ctx.fillStyle = '#7B87B8';
          ctx.fill();
          drawEllipseLocal(ctx, 4, 1.5, 1.4, 1.4, '#1A1414');
        } else if (p.kind === 'shadowball') {
          ctx.rotate(now * 8);
          drawEllipseLocal(ctx, 0, 0, 13, 13, 'rgba(60,20,80,0.4)');
          drawEllipseLocal(ctx, 0, 0, 7, 7, '#2E1240', '#0D0515', 1.5);
        } else if (p.kind === 'yellowball') {
          ctx.rotate(now * 9);
          drawEllipseLocal(ctx, 0, 0, 13, 13, 'rgba(255,224,60,0.35)');
          drawEllipseLocal(ctx, 0, 0, 7, 7, '#FFE03C', '#B89A10', 1.5);
        } else if (p.kind === 'saberthrow') {
          ctx.rotate(now * 14);
          const glow = p.saberColor === 'red' ? 'rgba(255,80,70,0.6)' : 'rgba(110,190,255,0.65)';
          const core = p.saberColor === 'red' ? '#FFEDEB' : '#E0F5FF';
          drawRoundedRectLocal(ctx, 0, 0, 6, 34, 3, 0, glow);
          drawRoundedRectLocal(ctx, 0, 0, 2.4, 34, 1.2, 0, core);
        } else if (p.kind === 'book') {
          ctx.rotate(now * 9);
          drawRoundedRectLocal(ctx, 0, 0, 14, 10, 1.5, 0, '#FFD166', '#8A6A1F', 1.2);
        } else if (p.kind === 'ball') {
          ctx.rotate(now * 9);
          drawEllipseLocal(ctx, 0, 0, 7, 7, '#1B4F9C', '#0D2C70', 1.2);
          ctx.strokeStyle = '#14141A';
          ctx.lineWidth = 0.8;
          ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.stroke();
          ctx.beginPath(); ctx.arc(0, 0, 7, -0.6, 0.6); ctx.stroke();
          ctx.beginPath(); ctx.arc(0, 0, 7, Math.PI - 0.6, Math.PI + 0.6); ctx.stroke();
        } else if (p.kind === 'horn') {
          ctx.rotate(now * 8);
          polygonPath(ctx, [[0, 12], [-5, -8], [5, -8]]);
          ctx.fillStyle = '#E8DCC0';
          ctx.fill();
          ctx.strokeStyle = '#8A7A50';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else if (p.kind === 'pianokey') {
          ctx.rotate(now * 10);
          drawRoundedRectLocal(ctx, 0, 0, 8, 16, 1.5, 0, '#FFFFFF', '#1A1420', 1.5);
        } else if (p.kind === 'plaqueSilver' || p.kind === 'plaqueBronze' || p.kind === 'plaqueGold' || p.kind === 'plaqueDiamond') {
          ctx.rotate(now * 7);
          const plaqueColor = p.kind === 'plaqueSilver' ? '#C9D2DC' : p.kind === 'plaqueBronze' ? '#B8734A' : p.kind === 'plaqueGold' ? '#FFD24A' : '#7CE0F5';
          const plaqueEdge = p.kind === 'plaqueSilver' ? '#8A9AA8' : p.kind === 'plaqueBronze' ? '#7A4A2A' : p.kind === 'plaqueGold' ? '#B8860B' : '#2FA8C4';
          drawRoundedRectLocal(ctx, 0, 0, 22, 14, 3, 0, plaqueColor, plaqueEdge, 2);
          polygonPath(ctx, [[-4, -2], [4, 0], [-4, 4]]);
          ctx.fillStyle = plaqueEdge;
          ctx.fill();
        } else {
          ctx.rotate(now * 8);
          drawEllipseLocal(ctx, 0, 0, 16, 16, 'rgba(120,190,255,0.3)');
          drawEllipseLocal(ctx, 0, 0, 8, 8, '#BFE6FF', '#FFFFFF', 1.5);
          for (let i = 0; i < 4; i++) {
            ctx.save();
            ctx.rotate((Math.PI / 2) * i);
            drawRoundedRectLocal(ctx, 12, 0, 12, 3, 1.5, 0, '#DFF3FF');
            ctx.restore();
          }
        }
        ctx.restore();
      }
    }

    _drawClouds(ctx, now, W, H) {
      const positions = [[0.16, 0.28], [0.5, 0.18], [0.36, 0.42]];
      positions.forEach((p, i) => {
        const drift = Math.sin(now / (18 + i * 6) * Math.PI * 2) * 60;
        const cx = W * p[0] + drift, cy = H * p[1];
        ctx.globalAlpha = 0.85;
        [[-20, 0, 16], [0, -6, 20], [20, 0, 16], [-6, 4, 14], [10, 4, 14]].forEach(([dx, dy, r]) => {
          drawEllipseLocal(ctx, cx + dx, cy + dy, r, r, '#FFFFFF');
        });
        ctx.globalAlpha = 1;
      });
    }

    _drawStars(ctx, now, W, H) {
      for (let i = 0; i < 40; i++) {
        const x = (i * 137.5) % W;
        const y = H * (0.05 + ((i * 71) % 60) / 100);
        const twinkle = 0.4 + 0.5 * Math.abs(Math.sin(now * 1.3 + i));
        ctx.globalAlpha = twinkle;
        drawEllipseLocal(ctx, x, y, 1.4, 1.4, '#FFFFFF');
      }
      ctx.globalAlpha = 1;
    }

    _drawEmbers(ctx, now, W, H) {
      for (let i = 0; i < 30; i++) {
        const seed = i * 53.7;
        const x = ((seed % W) + Math.sin(now * 0.6 + i) * 20 + W) % W;
        const riseT = (now * 25 + seed) % (H * 0.7);
        const y = riseT;
        const alpha = 0.3 + 0.5 * Math.abs(Math.sin(now + i));
        ctx.globalAlpha = alpha;
        drawEllipseLocal(ctx, x, y, 2 + (i % 3), 2 + (i % 3), '#FFB040');
      }
      ctx.globalAlpha = 1;
    }

    _drawVoidStars(ctx, now, W, H) {
      for (let i = 0; i < 50; i++) {
        const x = (i * 149.3) % W;
        const y = H * (0.02 + ((i * 83) % 70) / 100);
        const twinkle = 0.3 + 0.6 * Math.abs(Math.sin(now * 1.1 + i * 1.7));
        ctx.globalAlpha = twinkle;
        drawEllipseLocal(ctx, x, y, 1.2, 1.2, '#E6D9FF');
      }
      ctx.globalAlpha = 1;
    }

    _drawSnowfall(ctx, now, W, H) {
      ctx.globalAlpha = 0.85;
      for (let i = 0; i < 45; i++) {
        const seed = i * 61.3;
        const x = ((seed % W) + Math.sin(now * 0.5 + i) * 25 + W) % W;
        const y = (now * 40 + seed * 3) % H;
        drawEllipseLocal(ctx, x, y, 2 + (i % 3), 2 + (i % 3), '#FFFFFF');
      }
      ctx.globalAlpha = 1;
    }

    _drawHills(ctx, H) {
      const groundTopScreen = H - this.groundTop;
      const draw = (points, color) => {
        ctx.beginPath();
        ctx.moveTo(0, groundTopScreen);
        ctx.lineTo(points[0][0], groundTopScreen - points[0][1]);
        for (let i = 1; i < points.length; i++) {
          const cur = points[i];
          ctx.quadraticCurveTo(cur[2], groundTopScreen - cur[3], cur[0], groundTopScreen - cur[1]);
        }
        ctx.lineTo(this.width, groundTopScreen);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
      };
      draw(this._farHillPath, shade(this.biome.groundColor, 1.25));
      draw(this._nearHillPath, shade(this.biome.groundColor, 0.85));
    }

    _drawGround(ctx, H) {
      const groundTopScreen = H - this.groundTop;
      ctx.fillStyle = this.biome.groundColor;
      ctx.fillRect(0, groundTopScreen, this.width, this.groundTop);
      for (const p of this._groundPatches) {
        drawEllipseLocal(ctx, p.x, H - p.y, p.w / 2, p.h / 2, shade(this.biome.groundColor, p.lighter ? 1.12 : 0.85), null, 0, 0.5);
      }
    }

    _drawGrassBlade(ctx, t, H) {
      ctx.save();
      ctx.translate(t.x, H - t.y);
      ctx.rotate(t.rot);
      ctx.scale(t.scale, t.scale);
      polygonPath(ctx, [[-1.8, 0], [-0.4, -16], [0, -32], [0.4, -16], [1.8, 0]]);
      ctx.fillStyle = shade(this.biome.grassColor, t.lighter ? randRange(1.05, 1.2) : randRange(0.75, 0.95));
      ctx.fill();
      ctx.restore();
    }

    _drawTree(ctx, tree, H) {
      if (tree.style === 'palm') { this._drawPalmTree(ctx, tree, H); return; }
      ctx.save();
      ctx.translate(tree.x, H - tree.y);
      ctx.scale(1, -1);
      drawRoundedRectLocal(ctx, 0, tree.trunkHeight / 2, 16, tree.trunkHeight, 4, 0, tree.trunkColor, shade(tree.trunkColor, 0.6), 1.5);
      for (const c of tree.clusters) {
        drawEllipseLocal(ctx, c.x, c.y, c.rx, c.ry, c.color, shade(c.color, 0.6), 1.5);
      }
      ctx.restore();
    }

    _drawPalmTree(ctx, tree, H) {
      ctx.save();
      ctx.translate(tree.x, H - tree.y);
      ctx.scale(1, -1);
      const trunkH = tree.trunkHeight + 20;
      ctx.save();
      ctx.rotate(-0.06);
      drawRoundedRectLocal(ctx, 0, trunkH / 2, 8, trunkH, 4, 0, tree.trunkColor, shade(tree.trunkColor, 0.6), 1.5);
      ctx.restore();
      const crownY = trunkH + 4;
      const frondColor = tree.clusters[0] ? tree.clusters[0].color : '#2E8B57';
      const angles = [-70, -35, -5, 25, 55, 85].map((d) => d * Math.PI / 180);
      angles.forEach((a) => {
        ctx.save();
        ctx.translate(0, crownY);
        ctx.rotate(a);
        polygonPath(ctx, [[-3, 0], [0, 34], [3, 0]]);
        ctx.fillStyle = frondColor;
        ctx.fill();
        ctx.strokeStyle = shade(frondColor, 0.6);
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      });
      drawEllipseLocal(ctx, -4, crownY - 3, 4, 4, '#5C3A21');
      drawEllipseLocal(ctx, 4, crownY - 2, 4, 4, '#5C3A21');
      ctx.restore();
    }

    _drawHUD(ctx, W, H, now) {
      ctx.save();
      ctx.font = 'bold 13px -apple-system, "Segoe UI", sans-serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.boss.config.name, W / 2, 50);
      ctx.restore();
      drawStatBar(ctx, W / 2 - 110, 60, 220, 12, this.boss.healthFraction, 'rgba(191,38,38,1)', false);

      if (this.mode === 'local') {
        ctx.save();
        ctx.font = '11px -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Teclado — Miguel: WASD move, F ataca, G poder, H especial, R energia, T cura, Y água, U voo, I tempo, O gelo, J presente, K pizza, L lento, P equipe, 1/2 poderes, 5 empurrão, 7 controlar, 8 vídeo   |   Tiago: Setas move, . ataca, , poder, / especial, M energia, N cura, B água, V voo, C tempo, X gelo, Z presente, Q pizza, E lento, W equipe, 3/4 poderes, 6 empurrão, 9 controlar, 0 vídeo', W / 2, 78);
        ctx.restore();
      }

      this._drawPlayerPanel(ctx, 20, 96, this.miguel, false);
      this._drawPlayerPanel(ctx, W - 20, 96, this.tiago, true);

      if (this.joystickMiguel) this.joystickMiguel.draw(ctx);
      if (this.joystickTiago) this.joystickTiago.draw(ctx);
      if (this.attackButtonMiguel) this.attackButtonMiguel.draw(ctx);
      if (this.powerButtonMiguel) this.powerButtonMiguel.draw(ctx);
      if (this.attackButtonTiago) this.attackButtonTiago.draw(ctx);
      if (this.powerButtonTiago) this.powerButtonTiago.draw(ctx);
      if (this.specialButtonMiguel && this.miguel.hasSpecialPower) this.specialButtonMiguel.draw(ctx);
      if (this.specialButtonTiago && this.tiago.hasSpecialPower) this.specialButtonTiago.draw(ctx);
      if (this.blastButtonMiguel && this.miguel.hasEnergyBlast) this.blastButtonMiguel.draw(ctx);
      if (this.blastButtonTiago && this.tiago.hasEnergyBlast) this.blastButtonTiago.draw(ctx);
      if (this.healButtonMiguel && this.miguel.hasHeal) this.healButtonMiguel.draw(ctx);
      if (this.healButtonTiago && this.tiago.hasHeal) this.healButtonTiago.draw(ctx);
      if (this.waterButtonMiguel && this.miguel.hasWaterGun) this.waterButtonMiguel.draw(ctx);
      if (this.waterButtonTiago && this.tiago.hasWaterGun) this.waterButtonTiago.draw(ctx);
      if (this.flyButtonMiguel && this.miguel.hasFlyAttack) this.flyButtonMiguel.draw(ctx);
      if (this.flyButtonTiago && this.tiago.hasFlyAttack) this.flyButtonTiago.draw(ctx);
      if (this.tempoButtonMiguel && ['halfLife', 'fire', 'poison'].includes(this.miguel.tempoPowerType)) this.tempoButtonMiguel.draw(ctx);
      if (this.tempoButtonTiago && ['halfLife', 'fire', 'poison'].includes(this.tiago.tempoPowerType)) this.tempoButtonTiago.draw(ctx);
      if (this.iceButtonMiguel && this.miguel.hasIceAttack) this.iceButtonMiguel.draw(ctx);
      if (this.iceButtonTiago && this.tiago.hasIceAttack) this.iceButtonTiago.draw(ctx);
      if (this.giftButtonMiguel && this.miguel.canUseGift()) this.giftButtonMiguel.draw(ctx);
      if (this.giftButtonTiago && this.tiago.canUseGift()) this.giftButtonTiago.draw(ctx);
      if (this.pizzaButtonMiguel && this.miguel.hasPizzaPower) this.pizzaButtonMiguel.draw(ctx);
      if (this.pizzaButtonTiago && this.tiago.hasPizzaPower) this.pizzaButtonTiago.draw(ctx);
      if (this.slowButtonMiguel && this.miguel.hasSlowAttack) this.slowButtonMiguel.draw(ctx);
      if (this.slowButtonTiago && this.tiago.hasSlowAttack) this.slowButtonTiago.draw(ctx);
      if (this.teamHealButtonMiguel && this.miguel.hasTeamHeal) this.teamHealButtonMiguel.draw(ctx);
      if (this.teamHealButtonTiago && this.tiago.hasTeamHeal) this.teamHealButtonTiago.draw(ctx);
      this._drawExtraButtons(ctx);
      if (this.restartButton) this.restartButton.draw(ctx);
      this.musicButton.draw(ctx);

      const bt = now - this.banner.start;
      if (bt >= 0 && bt < this.banner.duration) {
        let alpha = 1;
        if (bt < 0.3) alpha = bt / 0.3;
        else if (bt > this.banner.duration - 0.5) alpha = (this.banner.duration - bt) / 0.5;
        ctx.save();
        ctx.globalAlpha = clamp(alpha, 0, 1);
        ctx.font = 'bold 24px -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = this.banner.color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.strokeText(this.banner.text, W / 2, H / 2);
        ctx.fillText(this.banner.text, W / 2, H / 2);
        ctx.restore();
      }
    }

    _shouldShowExtraAction(character, actionName) {
      switch (actionName) {
        case 'catSummon': return character.hasCatSummon;
        case 'yellowBall': return character.hasYellowBall;
        case 'spinAttack': return character.hasSpinAttack;
        case 'weakenSelf': return character.hasPostFase5Shield;
        case 'tigerBlind': return character.hasTigerBlind;
        case 'speedBurst': return character.hasSpeedBurst;
        case 'flyDebuff': return character.hasFlyDebuff;
        case 'fase8Shield': return character.hasFase8Shield && this.stageIndex === DARK_STAGE_INDEX;
        case 'bookFly': return character.hasFlyAttack;
        case 'puzzleWhirl': return character.hasPuzzleWhirl;
        case 'saberThrow': return character.hasSaberThrow;
        case 'vaderFreeze': return character.hasVaderFreeze && character.formIndex === 2;
        default: return false;
      }
    }

    _drawExtraButtons(ctx) {
      const pairs = [
        [this.extra1ButtonMiguel, this.miguel, 'extra1'], [this.extra1ButtonTiago, this.tiago, 'extra1'],
        [this.extra2ButtonMiguel, this.miguel, 'extra2'], [this.extra2ButtonTiago, this.tiago, 'extra2']
      ];
      for (const [btn, character, slot] of pairs) {
        if (!btn) continue;
        const extras = CHARACTER_EXTRA_ACTIONS[character.configKey];
        const actionName = extras ? extras[slot] : null;
        if (actionName && this._shouldShowExtraAction(character, actionName)) btn.draw(ctx);
      }
      if (this.pushButtonMiguel && this.miguel.hasPushAttack) this.pushButtonMiguel.draw(ctx);
      if (this.pushButtonTiago && this.tiago.hasPushAttack) this.pushButtonTiago.draw(ctx);
      const bossControlActive = this.stageIndex === WORLD2_PIANO_INDEX || this.stageIndex === WORLD2_YOUTUBE_INDEX;
      if (this.bossControlButtonMiguel && this.miguel.hasBossControl && bossControlActive) this.bossControlButtonMiguel.draw(ctx);
      if (this.bossControlButtonTiago && this.tiago.hasBossControl && bossControlActive) this.bossControlButtonTiago.draw(ctx);
      const videoFreezeActive = this.stageIndex === WORLD2_YOUTUBE_INDEX || this._youtubePowerUnlocked;
      if (this.videoFreezeButtonMiguel && this.miguel.hasVideoFreeze && videoFreezeActive) this.videoFreezeButtonMiguel.draw(ctx);
      if (this.videoFreezeButtonTiago && this.tiago.hasVideoFreeze && videoFreezeActive) this.videoFreezeButtonTiago.draw(ctx);
    }

    _drawPlayerPanel(ctx, x, yTop, character, alignRight) {
      const barW = 120, barH = 9, gap = 4;
      ctx.save();
      ctx.font = 'bold 13px -apple-system, "Segoe UI", sans-serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = alignRight ? 'right' : 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(character.config.shortName, x, yTop);
      ctx.restore();

      const barX = alignRight ? x - barW : x;
      drawStatBar(ctx, barX, yTop + 12, barW, barH, character.health / character.maxHealth, 'rgba(217,51,51,1)', false);
      drawStatBar(ctx, barX, yTop + 12 + (barH + gap), barW, barH, character.hunger / 100, 'rgba(230,166,38,1)', false);
      drawStatBar(ctx, barX, yTop + 12 + 2 * (barH + gap), barW, barH, character.water / 100, 'rgba(64,140,230,1)', false);

      let extraLine = 0;
      if (character.tempoPowerType) {
        const label = TEMPO_POWER_LABELS[character.tempoPowerType] || character.tempoPowerType;
        ctx.save();
        ctx.font = 'bold 11px -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = '#E0C8FF';
        ctx.textAlign = alignRight ? 'right' : 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${label} (${Math.ceil(character.tempoPowerTimer)}s)`, x, yTop + 12 + 3 * (barH + gap) + 4);
        ctx.restore();
        extraLine = 16;
      }

      if (character.foodLevel > 0 || character.waterLevel > 0) {
        ctx.save();
        ctx.font = 'bold 11px -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = '#FFE066';
        ctx.textAlign = alignRight ? 'right' : 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(`🥥${character.foodLevel}/3  💧${character.waterLevel}/3`, x, yTop + 12 + 3 * (barH + gap) + 4 + extraLine);
        ctx.restore();
      }
    }
  }

  function drawCharacterPreview(canvas, configKey) {
    const cfg = CHARACTER_CONFIGS[configKey];
    if (!cfg) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const scale = 0.72 * cfg.scale;
    ctx.save();
    ctx.translate(w / 2, h - 6);
    ctx.scale(scale, -scale);
    const previewChar = new Character(configKey);
    previewChar._drawFigure(ctx, cfg, 0, false);
    ctx.restore();
  }

  window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('game');
    const menu = document.getElementById('menu');
    const mainChoices = document.getElementById('main-choices');
    const btnLocal = document.getElementById('btn-local');
    const btnHost = document.getElementById('btn-host');
    const btnJoin = document.getElementById('btn-join');
    const btnTimeline = document.getElementById('btn-timeline');
    const timelinePanel = document.getElementById('timeline-panel');
    const btnTimelineBack = document.getElementById('btn-timeline-back');
    const btnTimelinePhotos = document.getElementById('btn-timeline-photos');
    const timelinePhotosPanel = document.getElementById('timeline-photos-panel');
    const btnTimelinePhotosBack = document.getElementById('btn-timeline-photos-back');
    const btnTimelineVersions = document.getElementById('btn-timeline-versions');
    const timelineVersionsPanel = document.getElementById('timeline-versions-panel');
    const btnTimelineVersionsBack = document.getElementById('btn-timeline-versions-back');
    const btnTimelinePlayV3 = document.getElementById('btn-timeline-play-v3');
    const characterPanel = document.getElementById('character-panel');
    const characterTitle = document.getElementById('character-title');
    const characterCards = Array.prototype.slice.call(document.querySelectorAll('.char-card'));
    characterCards.forEach((card) => {
      const key = card.getAttribute('data-key');
      const previewCanvas = card.querySelector('.char-preview');
      if (previewCanvas) drawCharacterPreview(previewCanvas, key);
    });
    const btnCharacterBack = document.getElementById('btn-character-back');
    const joinPanel = document.getElementById('join-panel');
    const hostPanel = document.getElementById('host-panel');
    const roomInput = document.getElementById('room-input');
    const btnJoinConfirm = document.getElementById('btn-join-confirm');
    const roomCodeEl = document.getElementById('room-code');
    const hostStatus = document.getElementById('host-status');
    const menuError = document.getElementById('menu-error');
    const peerWarning = document.getElementById('peer-warning');

    canvas.style.display = 'none';

    if (!NetworkManager.available()) {
      btnHost.disabled = true;
      btnJoin.disabled = true;
      btnHost.style.opacity = '0.4';
      btnJoin.style.opacity = '0.4';
      peerWarning.classList.remove('hidden');
    }

    function startGame(options) {
      menu.classList.add('hidden');
      canvas.style.display = 'block';
      new Game(canvas, options);
    }

    function showMainChoices() {
      characterPanel.classList.add('hidden');
      joinPanel.classList.add('hidden');
      hostPanel.classList.add('hidden');
      if (timelinePanel) timelinePanel.classList.add('hidden');
      if (timelinePhotosPanel) timelinePhotosPanel.classList.add('hidden');
      if (timelineVersionsPanel) timelineVersionsPanel.classList.add('hidden');
      mainChoices.classList.remove('hidden');
      menuError.textContent = '';
    }

    if (btnTimeline) {
      btnTimeline.addEventListener('click', () => {
        mainChoices.classList.add('hidden');
        timelinePanel.classList.remove('hidden');
      });
      btnTimelineBack.addEventListener('click', showMainChoices);
      btnTimelinePhotos.addEventListener('click', () => {
        timelinePanel.classList.add('hidden');
        timelinePhotosPanel.classList.remove('hidden');
      });
      btnTimelinePhotosBack.addEventListener('click', () => {
        timelinePhotosPanel.classList.add('hidden');
        timelinePanel.classList.remove('hidden');
      });
      btnTimelineVersions.addEventListener('click', () => {
        timelinePanel.classList.add('hidden');
        timelineVersionsPanel.classList.remove('hidden');
      });
      btnTimelineVersionsBack.addEventListener('click', () => {
        timelineVersionsPanel.classList.add('hidden');
        timelinePanel.classList.remove('hidden');
      });
      btnTimelinePlayV3.addEventListener('click', showMainChoices);
    }

    function showCharacterSelect(opts) {
      mainChoices.classList.add('hidden');
      joinPanel.classList.add('hidden');
      hostPanel.classList.add('hidden');
      characterTitle.textContent = opts.title;
      const exclude = opts.exclude || [];
      characterCards.forEach((card) => {
        const key = card.getAttribute('data-key');
        card.classList.toggle('taken', exclude.includes(key));
        card.onclick = exclude.includes(key) ? null : () => opts.onChoice(key);
      });
      characterPanel.classList.remove('hidden');
    }

    btnCharacterBack.addEventListener('click', showMainChoices);

    btnLocal.addEventListener('click', () => {
      showCharacterSelect({
        title: 'Jogador 1 (WASD) — escolha seu personagem',
        exclude: [],
        onChoice: (p1Key) => {
          showCharacterSelect({
            title: 'Jogador 2 (Setas) — escolha seu personagem',
            exclude: [p1Key],
            onChoice: (p2Key) => {
              startGame({ mode: 'local', miguelCharacterKey: p1Key, tiagoCharacterKey: p2Key });
            }
          });
        }
      });
    });

    btnHost.addEventListener('click', () => {
      showCharacterSelect({
        title: 'Escolha seu personagem',
        exclude: [],
        onChoice: (hostKey) => {
          const code = randomRoomCode();
          hostPanel.classList.remove('hidden');
          characterPanel.classList.add('hidden');
          roomCodeEl.textContent = code;
          menuError.textContent = '';

          const net = new NetworkManager();
          let started = false;
          net.host(code, {
            onOpen: () => {
              hostStatus.textContent = 'Conectado! Trocando dados...';
              net.send({ t: 'hello', characterKey: hostKey });
            },
            onMessage: (msg) => {
              if (msg.t === 'hello' && !started) {
                started = true;
                hostStatus.textContent = 'Iniciando...';
                setTimeout(() => startGame({ mode: 'host', net, localKey: 'miguel', miguelCharacterKey: hostKey, tiagoCharacterKey: msg.characterKey }), 300);
              }
            },
            onError: (err) => { menuError.textContent = 'Erro de rede: ' + (err && err.type ? err.type : err); }
          });
        }
      });
    });

    btnJoin.addEventListener('click', () => {
      showCharacterSelect({
        title: 'Escolha seu personagem',
        exclude: [],
        onChoice: (clientKey) => {
          joinPanel.classList.remove('hidden');
          characterPanel.classList.add('hidden');
          menuError.textContent = '';

          btnJoinConfirm.onclick = () => {
            const code = roomInput.value.trim().toUpperCase();
            if (code.length < 4) { menuError.textContent = 'Digite o código de 4 letras/números.'; return; }
            menuError.textContent = 'Conectando…';

            const net = new NetworkManager();
            let started = false;
            net.join(code, {
              onOpen: () => { net.send({ t: 'hello', characterKey: clientKey }); },
              onMessage: (msg) => {
                if (msg.t === 'hello' && !started) {
                  started = true;
                  startGame({ mode: 'client', net, localKey: 'tiago', miguelCharacterKey: msg.characterKey, tiagoCharacterKey: clientKey });
                }
              },
              onError: (err) => { menuError.textContent = 'Não foi possível conectar. Confira o código.'; }
            });
          };
        }
      });
    });
  });
})();

</script>
</body></html>
