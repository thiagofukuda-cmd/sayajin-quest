<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // Utilities
  // ---------------------------------------------------------------------

  function shade(hex, factor) {
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0, s = 0;
    const l = (max + min) / 2;
    const d = max - min;
    if (d !== 0) {
      s = d / (1 - Math.abs(2 * l - 1));
      switch (max) {
        case r: h = ((g - b) / d) % 6; break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h *= 60;
      if (h < 0) h += 360;
    }
    let newL = Math.max(0, Math.min(1, l * factor));
    const c = (1 - Math.abs(2 * newL - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = newL - c / 2;
    let r1 = 0, g1 = 0, b1 = 0;
    if (h < 60) { r1 = c; g1 = x; b1 = 0; }
    else if (h < 120) { r1 = x; g1 = c; b1 = 0; }
    else if (h < 180) { r1 = 0; g1 = c; b1 = x; }
    else if (h < 240) { r1 = 0; g1 = x; b1 = c; }
    else if (h < 300) { r1 = x; g1 = 0; b1 = c; }
    else { r1 = c; g1 = 0; b1 = x; }
    const toHex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
    return '#' + toHex(r1) + toHex(g1) + toHex(b1);
  }

  function rgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function dist(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function randRange(a, b) { return a + Math.random() * (b - a); }

  function roundRectPath(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawRoundedRectLocal(ctx, cx, cy, w, h, r, rotation, fill, stroke, lineWidth) {
    ctx.save();
    ctx.translate(cx, cy);
    if (rotation) ctx.rotate(rotation);
    roundRectPath(ctx, -w / 2, -h / 2, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth || 1.5; ctx.stroke(); }
    ctx.restore();
  }

  function drawEllipseLocal(ctx, cx, cy, rx, ry, fill, stroke, lineWidth, alpha) {
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha *= alpha;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth || 1.5; ctx.stroke(); }
    ctx.restore();
  }

  function polygonPath(ctx, points) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
  }

  function randomRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let out = '';

    return out;
  }

  class AudioEngine {
    constructor() {
      this.ctx = null;
      this.masterGain = null;
      this.musicNodes = [];
      this.musicLoopTimeout = null;
      this.trackIndex = 0;
    }

    ensure() {
      if (!this.ctx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new Ctx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 1;
        this.masterGain.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    }

    _scheduleNotes(notes, startTime, volume, destination) {
      let t = startTime;
      const nodes = [];
      for (const [freq, dur] of notes) {
        const osc = this.ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.value = freq;
        const g = this.ctx.createGain();
        const attack = Math.min(0.02, dur * 0.3);
        const release = Math.min(0.05, dur * 0.3);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(volume, t + attack);
        g.gain.setValueAtTime(volume, Math.max(t + attack, t + dur - release));
        g.gain.linearRampToValueAtTime(0, t + dur);
        osc.connect(g);
        g.connect(destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
        nodes.push(osc, g);
        t += dur;
      }
      return { endTime: t, nodes };
    }

    playTrack(index) {
      this.ensure();
      this.trackIndex = index;
      this._stopMusicNodes();
      const track = MUSIC_TRACKS[index];
      const totalDuration = track.notes.reduce((s, n) => s + n[1], 0);

      const loop = () => {
        const startTime = this.ctx.currentTime + 0.02;
        const { nodes } = this._scheduleNotes(track.notes, startTime, 0.05, this.masterGain);
        this.musicNodes = nodes;
        this.musicLoopTimeout = setTimeout(loop, totalDuration * 1000);
      };
      loop();
    }

    playVictoryTheme() {
      this.ensure();
      this._stopMusicNodes();
      const totalDuration = VICTORY_THEME_NOTES.reduce((s, n) => s + n[1], 0);

      const loop = () => {
        const startTime = this.ctx.currentTime + 0.02;
        const { nodes } = this._scheduleNotes(VICTORY_THEME_NOTES, startTime, 0.07, this.masterGain);
        this.musicNodes = nodes;
        this.musicLoopTimeout = setTimeout(loop, totalDuration * 1000);
      };
      loop();
    }

    stopMusic() {
      this._stopMusicNodes();
    }

    _stopMusicNodes() {
      if (this.musicLoopTimeout) { clearTimeout(this.musicLoopTimeout); this.musicLoopTimeout = null; }
      for (const n of this.musicNodes) {
        try { if (n.stop) n.stop(); } catch (e) { /* already stopped */ }
      }
      this.musicNodes = [];
    }

    playSfx(notes, volume) {
      this.ensure();
      this._scheduleNotes(notes, this.ctx.currentTime, volume, this.masterGain);
    }

    playAttackBlip() { this.playSfx(ATTACK_NOTES, 0.07); }
    playPowerBlip() { this.playSfx(POWER_NOTES, 0.08); }
    playVictoryJingle() { this.playSfx(VICTORY_NOTES, 0.09); }
    playSpecialBlip() { this.playSfx(SPECIAL_NOTES, 0.1); }
    playBlastBlip() { this.playSfx(BLAST_NOTES, 0.09); }
    playWaterBlip() { this.playSfx(WATER_NOTES, 0.09); }
    playHealChime() { this.playSfx(HEAL_NOTES, 0.08); }

    playHitImpact() {
      this.ensure();
      const duration = 0.22;
      const sr = this.ctx.sampleRate;
      const frameCount = Math.floor(duration * sr);
      const buffer = this.ctx.createBuffer(1, frameCount, sr);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < frameCount; i++) {
        const t = i / sr;
        const progress = i / frameCount;
        const envelope = Math.pow(1 - progress, 3);
        const thump = Math.sin(2 * Math.PI * 90 * t);
        const noise = Math.random() * 2 - 1;
        data[i] = (thump * 0.6 + noise * 0.5) * envelope * 0.3;
      }
      const src = this.ctx.createBufferSource();
      src.buffer = buffer;
      src.connect(this.masterGain);
      src.start();
    }
  }

  class Character {
    constructor(configKey) {
      this.configKey = configKey;
      this.config = CHARACTER_CONFIGS[configKey];
      this.x = 0;
      this.y = 0;
      this.facingRight = true;

      this.bobAmp = 2;
      this.bobPeriod = 1.8;

      this.formIndex = 0;
      this.powerLevel = 0;
      this.baseMaxHealth = 100;
      this.baseAttackDamage = 12;
      this.health = 100;
      this.hunger = 100;
      this.water = 100;

      this.attackCooldown = 0;
      this.specialCooldown = 0;
      this.blastCooldown = 0;
      this.healCooldown = 0;
      this.waterCooldown = 0;
      this.flyCooldown = 0;
      this.iceCooldown = 0;
      this.hasSpecialPower = false;
      this.hasEnergyBlast = false;
      this.hasHeal = false;
      this.hasWaterGun = false;
      this.hasFlyAttack = false;
      this.hasIceAttack = false;
      this.attackBoostMultiplier = 1;

      this.hasGiftPower = false;
      this.giftUsed = false;
      this.hasPizzaPower = false;
      this.pizzaCooldown = 0;
      this.hasSlowAttack = configKey === 'jamires';
      this.slowCooldown = 0;
      this.hasTeamHeal = configKey === 'jamires';
      this.teamHealCooldown = 0;

      this.tempoPowerType = null;
      this.tempoPowerTimer = 0;
      this.tempoActionCooldown = 0;

      this.attackAnimT = -1;
      this.chargePulseT = -1;
      this.transformFlashT = -1;
      this.hitFlashT = -1;
      this.knockdownT = -1;
      this.knockdownFallAngle = 0;

      this.flyAnimT = -1;
      this.flyTargetX = 0;
      this.flyTargetY = 0;

      this.foodLevel = 0;
      this.waterLevel = 0;

      this.stunStartT = -1;
      this.stunDuration = 0;
      this.immuneTimer = 0;
      this.speedBurstTimer = 0;

      this.hasCatSummon = false;
      this.catActive = false;
      this.hasYellowBall = false;
      this.yellowBallCooldown = 0;

      this.hasSpinAttack = false;
      this.spinCooldown = 0;
      this.hasPostFase5Shield = false;
      this.weakenSelfCooldown = 0;

      this.hasTigerBlind = configKey === 'kai';
      this.tigerCooldown = 0;
      this.hasSpeedBurst = configKey === 'kai';
      this.speedBurstCooldown = 0;

      this.hasFlyDebuff = configKey === 'ester';
      this.flyDebuffCooldown = 0;
      this.hasFase8Shield = configKey === 'ester';
      this.fase8ShieldCooldown = 0;

      if (configKey === 'jamires') this.hasFlyAttack = true;
      this.hasPuzzleWhirl = configKey === 'jamires';
      this.puzzleWhirlCooldown = 0;

      this.hasSaberThrow = configKey === 'luiza';
      this.saberThrowCooldown = 0;
      this.hasVaderFreeze = configKey === 'luiza';
      this.vaderFreezeCooldown = 0;

      this.hasPushAttack = false;
      this.pushCooldown = 0;

      this.animalForm = null;

      this.hasBossControl = false;
      this.bossControlCooldown = 0;
      this.hasVideoFreeze = false;
      this.videoFreezeCooldown = 0;

      this._remoteTimeMap = {};
    }

    get currentForm() { return this.config.forms[this.formIndex]; }
    get animalMul() { return this.animalForm ? ANIMAL_STATS[this.animalForm] : null; }
    get maxHealth() {
      const base = this.baseMaxHealth + this.currentForm.hpBonus;
      return this.animalMul ? Math.round(base * this.animalMul.hpMul) : base;
    }
    get isDefeated() { return this.health <= 0; }

    setFacing(right) { this.facingRight = right; }

    move(dx, dy, dt) {
      if (dx === 0 && dy === 0) return;
      const len = Math.sqrt(dx * dx + dy * dy);
      const nx = dx / len, ny = dy / len;
      const burstMul = this.speedBurstTimer > 0 ? 2.5 : 1;
      const speed = 160 * this.currentForm.speedMul * FOOD_SPEED_MULTIPLIERS[this.foodLevel] * burstMul;
      this.x += nx * speed * dt;
      this.y += ny * speed * dt;
      if (nx > 0.05) this.facingRight = true;
      else if (nx < -0.05) this.facingRight = false;
    }

    isStunned(now) { return this.stunStartT >= 0 && (now - this.stunStartT) < this.stunDuration; }

    setMoving(moving) {
      if (moving === this.isMoving) return;
      this.isMoving = moving;
      this.bobAmp = moving ? 4 : 2;
      this.bobPeriod = moving ? 0.3 : 1.8;
    }

    canAttack() { return this.attackCooldown <= 0 && !this.isDefeated; }
    isAttackLocked(now) { return this.attackAnimT >= 0 && (now - this.attackAnimT) < 0.2; }
    canUseSpecial() { return this.hasSpecialPower && this.specialCooldown <= 0 && !this.isDefeated; }
    canUseBlast() { return this.hasEnergyBlast && this.blastCooldown <= 0 && !this.isDefeated; }
    canUseHeal() { return this.hasHeal && this.healCooldown <= 0 && !this.isDefeated; }
    canUseWater() { return this.hasWaterGun && this.waterCooldown <= 0 && !this.isDefeated; }
    canUseFly() { return this.hasFlyAttack && this.flyCooldown <= 0 && !this.isDefeated; }
    canUseIce() { return this.hasIceAttack && this.iceCooldown <= 0 && !this.isDefeated; }
    canUseGift() { return this.hasGiftPower && !this.giftUsed && !this.isDefeated; }
    canUsePizza() { return this.hasPizzaPower && this.pizzaCooldown <= 0 && !this.isDefeated; }
    canUseSlow() { return this.hasSlowAttack && this.slowCooldown <= 0 && !this.isDefeated; }
    canUseTeamHeal() { return this.hasTeamHeal && this.teamHealCooldown <= 0 && !this.isDefeated; }
    canUseTempoAction() { return !!this.tempoPowerType && this.tempoActionCooldown <= 0 && !this.isDefeated; }
    canUseCatSummon() { return this.hasCatSummon && !this.catActive && !this.isDefeated; }
    canUseYellowBall() { return this.hasYellowBall && this.yellowBallCooldown <= 0 && !this.isDefeated; }
    canUseSpinAttack() { return this.hasSpinAttack && this.spinCooldown <= 0 && !this.isDefeated; }
    canUseWeakenSelf() { return this.hasPostFase5Shield && this.weakenSelfCooldown <= 0 && !this.isDefeated; }
    canUseTigerBlind() { return this.hasTigerBlind && this.tigerCooldown <= 0 && !this.isDefeated; }
    canUseSpeedBurst() { return this.hasSpeedBurst && this.speedBurstCooldown <= 0 && !this.isDefeated; }
    canUseFlyDebuff() { return this.hasFlyDebuff && this.flyDebuffCooldown <= 0 && !this.isDefeated; }
    canUseFase8Shield() { return this.hasFase8Shield && this.fase8ShieldCooldown <= 0 && !this.isDefeated; }
    canUsePuzzleWhirl() { return this.hasPuzzleWhirl && this.puzzleWhirlCooldown <= 0 && !this.isDefeated; }
    canUseSaberThrow() { return this.hasSaberThrow && this.saberThrowCooldown <= 0 && !this.isDefeated; }
    canUseVaderFreeze() { return this.hasVaderFreeze && this.formIndex === 2 && this.vaderFreezeCooldown <= 0 && !this.isDefeated; }
    canUsePush() { return this.hasPushAttack && this.pushCooldown <= 0 && !this.isDefeated; }
    canUseBossControl() { return this.hasBossControl && this.bossControlCooldown <= 0 && !this.isDefeated; }
    canUseVideoFreeze() { return this.hasVideoFreeze && this.videoFreezeCooldown <= 0 && !this.isDefeated; }

    performAttack(now) {
      this.attackCooldown = 0.6;
      this.attackAnimT = now;
      const animalMul = this.animalMul ? this.animalMul.dmgMul : 1;
      return Math.round(this.baseAttackDamage * this.currentForm.dmgMul * this.attackBoostMultiplier * WATER_DAMAGE_MULTIPLIERS[this.waterLevel] * GLOBAL_DAMAGE_MULTIPLIER * animalMul);
    }

    performBossControl(now) {
      this.bossControlCooldown = 16.0;
      this.attackAnimT = now;
    }

    performVideoFreeze(now) {
      this.videoFreezeCooldown = 20.0;
      this.attackAnimT = now;
    }

    performSpecialAttack(now) {
      this.specialCooldown = 3.0;
      this.attackAnimT = now;
    }

    performEnergyBlast(now) {
      this.blastCooldown = 1.5;
      this.attackAnimT = now;
      return Math.round(15 * WATER_DAMAGE_MULTIPLIERS[this.waterLevel] * GLOBAL_DAMAGE_MULTIPLIER);
    }

    performWaterBlast(now) {
      this.waterCooldown = 1.5;
      this.attackAnimT = now;
      return Math.round(22 * WATER_DAMAGE_MULTIPLIERS[this.waterLevel] * GLOBAL_DAMAGE_MULTIPLIER);
    }

    performHeal(now) {
      this.healCooldown = 5.0;
      this.health = Math.min(this.maxHealth, this.health + 40 * GLOBAL_HEAL_MULTIPLIER);
    }

    performFlyAttack(now) {
      this.flyCooldown = 10.0;
      this.attackAnimT = now;
      return Math.round(45 * WATER_DAMAGE_MULTIPLIERS[this.waterLevel] * GLOBAL_DAMAGE_MULTIPLIER);
    }

    performIceAttack(now) {
      this.iceCooldown = 1.5;
      this.attackAnimT = now;
      return Math.round(20 * WATER_DAMAGE_MULTIPLIERS[this.waterLevel] * GLOBAL_DAMAGE_MULTIPLIER);
    }

    performCatSummon(now) {
      this.catActive = true;
      this.attackAnimT = now;
    }

    performYellowBall(now) {
      this.yellowBallCooldown = 3.0;
      this.attackAnimT = now;

    performSpinAttack(now) {

    }

    performTigerBlind(now) {

    }

    performSpeedBurst(now) {

    useGift() {

    grantIceAttack() {

    }

    grantWaterLevel() {
      this.waterLevel = Math.min(3, this.waterLevel + 1);
    }

    grantPushAttack() {
      this.hasPushAttack = true;
    }

    grantCatSummon() {
      this.hasCatSummon = true;
    }

    }

    grantYellowBall() {

    }

    grantBossControl() {

    }

    }

    grantGiftPower() {

    }

    grantPizzaPower() {

    }

    grantTempoPower(type) {
      this.tempoPowerType = type;
      this.tempoPowerTimer = TEMPO_POWER_DURATION;
      this.tempoActionCooldown = 0;
    }

    takeDamage(amount, now) {
      if (this.isDefeated) return;
      this.health = Math.max(0, this.health - amount);
      this.hitFlashT = now;
      this.knockdownT = now;
      this.knockdownFallAngle = this.facingRight ? -1.1 : 1.1;
    }

    restoreFullHealth() { this.health = this.maxHealth; }

    chargePower(now) {
      if (this.powerLevel >= 100) return;
      this.powerLevel = Math.min(100, this.powerLevel + 25);
      this.chargePulseT = now;
      const forms = this.config.forms;
      let newIndex = 0;
      for (let i = 0; i < forms.length; i++) if (this.powerLevel >= forms[i].threshold) newIndex = i;
      if (newIndex !== this.formIndex) {
        const prevMax = this.maxHealth;
        this.formIndex = newIndex;
        this.health += Math.max(0, this.maxHealth - prevMax);
        this.transformFlashT = now;
      }
    }

    updateTimers(dt) {
      if (this.attackCooldown > 0) this.attackCooldown -= dt;
      if (this.specialCooldown > 0) this.specialCooldown -= dt;
      if (this.blastCooldown > 0) this.blastCooldown -= dt;
      if (this.healCooldown > 0) this.healCooldown -= dt;
      if (this.waterCooldown > 0) this.waterCooldown -= dt;
      if (this.flyCooldown > 0) this.flyCooldown -= dt;
      if (this.iceCooldown > 0) this.iceCooldown -= dt;
      if (this.pizzaCooldown > 0) this.pizzaCooldown -= dt;
      if (this.slowCooldown > 0) this.slowCooldown -= dt;
      if (this.teamHealCooldown > 0) this.teamHealCooldown -= dt;
      if (this.tempoActionCooldown > 0) this.tempoActionCooldown -= dt;
      if (this.tempoPowerType) {
        this.tempoPowerTimer -= dt;
        if (this.tempoPowerTimer <= 0) { this.tempoPowerType = null; this.tempoPowerTimer = 0; }
      }
      if (this.yellowBallCooldown > 0) this.yellowBallCooldown -= dt;
      if (this.spinCooldown > 0) this.spinCooldown -= dt;
      if (this.weakenSelfCooldown > 0) this.weakenSelfCooldown -= dt;
      if (this.tigerCooldown > 0) this.tigerCooldown -= dt;
      if (this.speedBurstCooldown > 0) this.speedBurstCooldown -= dt;
      if (this.flyDebuffCooldown > 0) this.flyDebuffCooldown -= dt;
      if (this.fase8ShieldCooldown > 0) this.fase8ShieldCooldown -= dt;
      if (this.puzzleWhirlCooldown > 0) this.puzzleWhirlCooldown -= dt;
      if (this.saberThrowCooldown > 0) this.saberThrowCooldown -= dt;
      if (this.vaderFreezeCooldown > 0) this.vaderFreezeCooldown -= dt;
      if (this.pushCooldown > 0) this.pushCooldown -= dt;
      if (this.bossControlCooldown > 0) this.bossControlCooldown -= dt;
      if (this.videoFreezeCooldown > 0) this.videoFreezeCooldown -= dt;
      if (this.immuneTimer > 0) { this.immuneTimer -= dt; if (this.immuneTimer < 0) this.immuneTimer = 0; }
      if (this.speedBurstTimer > 0) { this.speedBurstTimer -= dt; if (this.speedBurstTimer < 0) this.speedBurstTimer = 0; }
      this.hunger = Math.max(0, this.hunger - dt * (100 / 180));
      this.water = Math.max(0, this.water - dt * (100 / 150));
    }

    // -- networking: serialize authoritative state, apply on remote peers --

    serialize() {
      return {
        x: this.x, y: this.y, facingRight: this.facingRight, isMoving: this.isMoving,
        bobAmp: this.bobAmp, bobPeriod: this.bobPeriod,
        formIndex: this.formIndex, powerLevel: this.powerLevel,
        health: this.health, hunger: this.hunger, water: this.water,
        hasSpecialPower: this.hasSpecialPower, attackBoostMultiplier: this.attackBoostMultiplier,
        hasEnergyBlast: this.hasEnergyBlast, hasHeal: this.hasHeal, hasWaterGun: this.hasWaterGun,
        hasFlyAttack: this.hasFlyAttack, hasIceAttack: this.hasIceAttack,
        hasGiftPower: this.hasGiftPower, giftUsed: this.giftUsed,
        hasPizzaPower: this.hasPizzaPower, pizzaCooldown: this.pizzaCooldown,
        hasSlowAttack: this.hasSlowAttack, slowCooldown: this.slowCooldown,
        hasTeamHeal: this.hasTeamHeal, teamHealCooldown: this.teamHealCooldown,
        tempoPowerType: this.tempoPowerType, tempoPowerTimer: this.tempoPowerTimer,
        attackAnimT: this.attackAnimT, chargePulseT: this.chargePulseT,
        transformFlashT: this.transformFlashT, hitFlashT: this.hitFlashT,
        knockdownT: this.knockdownT, knockdownFallAngle: this.knockdownFallAngle,
        flyAnimT: this.flyAnimT, flyTargetX: this.flyTargetX, flyTargetY: this.flyTargetY,
        foodLevel: this.foodLevel, waterLevel: this.waterLevel,
        stunStartT: this.stunStartT, stunDuration: this.stunDuration,
        immuneTimer: this.immuneTimer, speedBurstTimer: this.speedBurstTimer,
        catActive: this.catActive, hasPostFase5Shield: this.hasPostFase5Shield,
        hasPushAttack: this.hasPushAttack, hasCatSummon: this.hasCatSummon,
        hasYellowBall: this.hasYellowBall, animalForm: this.animalForm,
        hasBossControl: this.hasBossControl, hasVideoFreeze: this.hasVideoFreeze
      };
    }

    applyRemote(state, localNow) {
      this.x = state.x; this.y = state.y;
      this.facingRight = state.facingRight; this.isMoving = state.isMoving;
      this.bobAmp = state.bobAmp; this.bobPeriod = state.bobPeriod;
      this.formIndex = state.formIndex; this.powerLevel = state.powerLevel;
      this.health = state.health; this.hunger = state.hunger; this.water = state.water;
      this.hasSpecialPower = state.hasSpecialPower; this.attackBoostMultiplier = state.attackBoostMultiplier;
      this.hasEnergyBlast = state.hasEnergyBlast; this.hasHeal = state.hasHeal; this.hasWaterGun = state.hasWaterGun;
      this.hasFlyAttack = state.hasFlyAttack; this.hasIceAttack = state.hasIceAttack;
      this.hasGiftPower = state.hasGiftPower; this.giftUsed = state.giftUsed;
      this.hasPizzaPower = state.hasPizzaPower; this.pizzaCooldown = state.pizzaCooldown;
      this.hasSlowAttack = state.hasSlowAttack; this.slowCooldown = state.slowCooldown;
      this.hasTeamHeal = state.hasTeamHeal; this.teamHealCooldown = state.teamHealCooldown;
      this.tempoPowerType = state.tempoPowerType; this.tempoPowerTimer = state.tempoPowerTimer;
      this.flyTargetX = state.flyTargetX; this.flyTargetY = state.flyTargetY;
      this.foodLevel = state.foodLevel; this.waterLevel = state.waterLevel;
      this.stunDuration = state.stunDuration;
      this.immuneTimer = state.immuneTimer; this.speedBurstTimer = state.speedBurstTimer;
      this.catActive = state.catActive; this.hasPostFase5Shield = state.hasPostFase5Shield;
      this.hasPushAttack = state.hasPushAttack;
      this.hasCatSummon = state.hasCatSummon;
      this.hasYellowBall = state.hasYellowBall; this.animalForm = state.animalForm;
      this.hasBossControl = state.hasBossControl; this.hasVideoFreeze = state.hasVideoFreeze;

      const remapField = (field) => {
        const raw = state[field];
        const prevRaw = this._remoteTimeMap[field + '_raw'];
        if (raw < 0) { this[field] = -1; this._remoteTimeMap[field + '_raw'] = raw; return; }
        if (raw !== prevRaw) {
          this._remoteTimeMap[field + '_raw'] = raw;
          this._remoteTimeMap[field + '_local'] = localNow;
        }
        this[field] = this._remoteTimeMap[field + '_local'] !== undefined ? this._remoteTimeMap[field + '_local'] : localNow;
      };
      remapField('attackAnimT');
      remapField('chargePulseT');
      remapField('transformFlashT');
      remapField('hitFlashT');
      remapField('knockdownT');
      remapField('flyAnimT');
      remapField('stunStartT');
      this.knockdownFallAngle = state.knockdownFallAngle;
    }

    _flyVisualPos(now) {
      if (this.flyAnimT < 0) return { x: this.x, y: this.y, flying: false };
      const t = now - this.flyAnimT;
      if (t >= FLY_ANIM_DURATION) { this.flyAnimT = -1; return { x: this.x, y: this.y, flying: false }; }
      const half = FLY_ANIM_DURATION / 2;
      const p = t < half ? (t / half) : (1 - (t - half) / half);
      return {
        x: this.x + (this.flyTargetX - this.x) * p,
        y: this.y + (this.flyTargetY - this.y) * p,
        flying: true
      };
    }

    draw(ctx, now, canvasH) {
      const cfg = this.config;
      const visual = this._flyVisualPos(now);
      const screenX = visual.x;
      const screenY = canvasH - visual.y;

      ctx.save();
      ctx.translate(screenX, screenY);
      ctx.scale(1, -1);
      ctx.scale(cfg.scale, cfg.scale);

      drawEllipseLocal(ctx, 4, 1, 21, 5.5, 'rgba(0,0,0,0.25)');

      const bob = Math.sin((now - this.bobPhase) / this.bobPeriod * Math.PI * 2) * this.bobAmp;

      ctx.save();
      ctx.translate(0, bob);
      ctx.scale(this.facingRight ? 1 : -1, 1);

      this._drawAura(ctx, now);

      ctx.save();
      ctx.rotate(this._figureRotation(now));
      ctx.globalAlpha = this._hitFlashAlpha(now);
      if (this.animalForm) this._drawAnimalFigure(ctx, this.animalForm, now);
      else this._drawFigure(ctx, cfg, now, visual.flying);
      ctx.restore();

      ctx.restore();
      ctx.restore();

      const labelWorldY = visual.y + (HEAD_CY + HEAD_R + 48) * cfg.scale;
      ctx.save();
      ctx.font = 'bold 13px -apple-system, "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1B2415';
      ctx.fillStyle = '#FFFFFF';
      const lx = screenX, ly = canvasH - labelWorldY;
      const label = this.animalForm ? (this.animalForm === 'vaca' ? 'Vaca' : 'Gato') : this.currentForm.name;
      ctx.strokeText(label, lx, ly);
      ctx.fillText(label, lx, ly);
      ctx.restore();
    }

    _drawAnimalFigure(ctx, form, now) {
      const bodyY = 46;
      if (form === 'vaca') {
        drawEllipseLocal(ctx, 0, bodyY, 34, 26, '#F5F0E6', '#D9D2C4', 2);
        drawEllipseLocal(ctx, -10, bodyY + 6, 9, 7, '#2A2A2A');
        drawEllipseLocal(ctx, 12, bodyY - 4, 7, 6, '#2A2A2A');
        drawEllipseLocal(ctx, 6, bodyY + 12, 6, 5, '#2A2A2A');
        drawEllipseLocal(ctx, 0, bodyY + 30, 20, 18, '#F5F0E6', '#D9D2C4', 2);
        drawEllipseLocal(ctx, -6, bodyY + 26, 5, 4, '#2A2A2A');
        drawEllipseLocal(ctx, 4, bodyY + 34, 6, 5, '#2A2A2A');
        drawEllipseLocal(ctx, 0, bodyY + 46, 13, 11, '#F9C9B0', '#D99A78', 1.5);
        drawEllipseLocal(ctx, -4, bodyY + 45, 2.5, 2, '#5C3A2A');
        drawEllipseLocal(ctx, 4, bodyY + 45, 2.5, 2, '#5C3A2A');
        [-1, 1].forEach((side) => {
          ctx.save();
          ctx.translate(side * 6, bodyY + 58);
          ctx.rotate(side * 0.3);
          polygonPath(ctx, [[-3, 0], [0, 12], [3, 0]]);
          ctx.fillStyle = '#E8DCC0';
          ctx.fill();
          ctx.strokeStyle = '#B8A878';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.restore();
        });
        [-1, 1].forEach((side) => {
          drawRoundedRectLocal(ctx, side * 12, bodyY - 22, 6, 14, 3, 0, '#F5F0E6', '#D9D2C4', 1.5);
        });
      } else {
        drawEllipseLocal(ctx, 0, bodyY, 26, 22, '#E68C3C', '#B8641A', 2);
        drawEllipseLocal(ctx, 0, bodyY + 26, 17, 15, '#E68C3C', '#B8641A', 2);
        drawEllipseLocal(ctx, -3, bodyY + 24, 8, 9, '#FFE0B8');
        drawEllipseLocal(ctx, 0, bodyY + 40, 11, 9, '#FFE0B8', '#D9B888', 1.5);
        drawEllipseLocal(ctx, -3.5, bodyY + 39, 2.2, 2.4, '#1A1A1A');
        drawEllipseLocal(ctx, 3.5, bodyY + 39, 2.2, 2.4, '#1A1A1A');
        drawEllipseLocal(ctx, 0, bodyY + 34, 1.8, 1.5, '#7A4A2A');
        ctx.save();
        ctx.strokeStyle = 'rgba(30,20,10,0.5)';
        ctx.lineWidth = 1;
        [-1, 1].forEach((side) => {
          for (let i = 0; i < 2; i++) {
            ctx.beginPath();
            ctx.moveTo(side * 8, bodyY + 33 - i * 3);
            ctx.lineTo(side * 20, bodyY + 30 - i * 5);
            ctx.stroke();
          }
        });
        ctx.restore();
        [-1, 1].forEach((side) => {
          ctx.save();
          ctx.translate(side * 8, bodyY + 50);
          polygonPath(ctx, [[-4, 0], [0, 10], [4, 0]]);
          ctx.fillStyle = '#E68C3C';
          ctx.fill();
          ctx.strokeStyle = '#B8641A';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          drawEllipseLocal(ctx, 0, 4, 2, 2.5, '#FFE0B8');
          ctx.restore();
        });
        ctx.save();
        ctx.translate(20, bodyY - 4);
        ctx.rotate(-0.6);
        drawRoundedRectLocal(ctx, 0, 0, 8, 24, 4, 0, '#E68C3C', '#B8641A', 1.5);
        ctx.restore();
      }
    }

    _figureRotation(now) {
      let base = 0.05;
      if (this.knockdownT >= 0) {
        const t = now - this.knockdownT;
        if (t < 0.12) {
          const p = t / 0.12;
          return base + (this.knockdownFallAngle - base) * p;
        } else if (t < 0.47) {
          return this.knockdownFallAngle;
        } else if (t < 0.69) {
          const p = (t - 0.47) / 0.22;
          return this.knockdownFallAngle + (base - this.knockdownFallAngle) * p;
        } else {
          this.knockdownT = -1;
        }
      }
      return base;
    }

    _hitFlashAlpha(now) {
      if (this.hitFlashT < 0) return 1;
      const t = now - this.hitFlashT;
      const cycle = 0.13;
      if (t > cycle * 2) { this.hitFlashT = -1; return 1; }
      const local = t % cycle;
      return local < cycle * 0.4 ? 0.35 : 1.0;
    }

    _auraScale(now) {
      let s = 1.0;
      if (this.chargePulseT >= 0) {
        const t = now - this.chargePulseT;
        if (t < 0.3 && this.formIndex > 0) {
          s = t < 0.15 ? 1 + 0.1 * (t / 0.15) : 1.1 - 0.1 * ((t - 0.15) / 0.15);
        } else {
          this.chargePulseT = -1;
        }
      }
      if (this.transformFlashT >= 0) {
        const t = now - this.transformFlashT;
        if (t < 0.4) {
          s = t < 0.2 ? 1 + 0.35 * (t / 0.2) : 1.35 - 0.35 * ((t - 0.2) / 0.2);
        } else {
          this.transformFlashT = -1;
        }
      }
      return s;
    }

    _drawAura(ctx, now) {
      const form = this.currentForm;
      if (!form.auraColor) return;
      const s = this._auraScale(now);
      drawEllipseLocal(ctx, 0, SHOULDER_Y - 5, 36 * s, 36 * s, form.auraColor);
    }

    _armOffset(now) {
      if (this.attackAnimT < 0) return 0;
      const t = now - this.attackAnimT;
      if (t < 0.07) return 7 * (t / 0.07);
      if (t < 0.2) return 7 * (1 - (t - 0.07) / 0.13);
      this.attackAnimT = -1;
      return 0;
    }

    _drawFigure(ctx, cfg, now, flying) {
      const isJedi = !!cfg.jedi;
      const form = this.currentForm;
      const vader = isJedi && !!form.vader;
      const hairColor = (!isJedi && this.formIndex > 0) ? SUPER_SAYAJIN_HAIR : cfg.hairColor;
      const hairHighlight = (!isJedi && this.formIndex > 0) ? SUPER_SAYAJIN_HAIR_HIGHLIGHT : cfg.hairHighlight;
      const bodyCfg = vader
        ? Object.assign({}, cfg, { giColor: '#15151A', giStroke: '#000000', undershirtColor: '#000000', accentColor: '#000000', accentStroke: '#000000' })
        : cfg;
      const swingAngle = this._swordSwingAngle(now);

      if (vader) {
        polygonPath(ctx, [[-19, HIP_Y + 6], [0, SHOULDER_Y + 10], [19, HIP_Y + 6], [13, HIP_Y - 12], [-13, HIP_Y - 12]]);
        ctx.fillStyle = '#0A0A0C';
        ctx.fill();
      }

      this._drawLeg(ctx, bodyCfg, 16, 0.14);
      this._drawLeg(ctx, bodyCfg, -8, -0.1);

      const torsoW = isJedi ? 31 : 36;
      drawRoundedRectLocal(ctx, 0, HIP_Y + TORSO_H / 2, torsoW, TORSO_H, 9, 0, bodyCfg.giColor, bodyCfg.giStroke, 2);

      polygonPath(ctx, [[-7, SHOULDER_Y - 3], [0, SHOULDER_Y - 13], [7, SHOULDER_Y - 3]]);
      ctx.fillStyle = bodyCfg.undershirtColor;
      ctx.fill();

      drawRoundedRectLocal(ctx, 0, HIP_Y, isJedi ? 32 : 38, 8, 2, 0, bodyCfg.accentColor, bodyCfg.accentStroke, 1.5);

      if (isJedi) {
        polygonPath(ctx, [[-14, HIP_Y - 1], [14, HIP_Y - 1], [10, HIP_Y - 15], [-10, HIP_Y - 15]]);
        ctx.fillStyle = bodyCfg.giColor;
        ctx.fill();
        ctx.strokeStyle = bodyCfg.giStroke;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      this._drawArm(ctx, bodyCfg, false, now);
      this._drawArm(ctx, bodyCfg, true, now);
      this._drawHeldItem(ctx, cfg, form, swingAngle);

      if (vader) {
        this._drawVaderHead(ctx, flying);
        return;
      }

      drawEllipseLocal(ctx, 0, HEAD_CY, HEAD_R, HEAD_R * 1.04, SKIN_COLOR, SKIN_STROKE, 1.5);
      if (flying) {
        drawEllipseLocal(ctx, 0, HEAD_CY, HEAD_R, HEAD_R * 1.04, 'rgba(230,30,20,0.65)');
      }

      drawEllipseLocal(ctx, -4.5, HEAD_CY, 1.3, 1.7, '#1A1414');
      drawEllipseLocal(ctx, 4.5, HEAD_CY, 1.3, 1.7, '#1A1414');
      if (isJedi) {
        ctx.save();
        ctx.strokeStyle = '#1A1414';
        ctx.lineWidth = 0.8;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-5.8, HEAD_CY + 1.6); ctx.lineTo(-7.3, HEAD_CY + 2.9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(5.8, HEAD_CY + 1.6); ctx.lineTo(7.3, HEAD_CY + 2.9); ctx.stroke();
        ctx.restore();
        drawEllipseLocal(ctx, -6.8, HEAD_CY - 3, 1.9, 1.2, 'rgba(230,120,130,0.5)');
        drawEllipseLocal(ctx, 6.8, HEAD_CY - 3, 1.9, 1.2, 'rgba(230,120,130,0.5)');
      }
      if (!isJedi) {
        drawRoundedRectLocal(ctx, -4.5, HEAD_CY + 5.5, 6.5, 2.2, 1, 0.35, hairColor);
        drawRoundedRectLocal(ctx, 4.5, HEAD_CY + 5.5, 6.5, 2.2, 1, -0.35, hairColor);
      }
      drawRoundedRectLocal(ctx, 0, HEAD_CY - 3.5, 1.8, 4.5, 0.9, 0, shade(SKIN_COLOR, 0.82));
      drawRoundedRectLocal(ctx, 0, HEAD_CY - 7.5, 6.5, 1.6, 0.8, 0, MOUTH_COLOR);

      if (isJedi) {
        this._drawLongHair(ctx, hairColor, hairHighlight, now);
      } else {
        ctx.save();
        ctx.translate(0, HAIR_ANCHOR_Y);
        ctx.rotate(Math.sin(now * 2.6 + this.bobPhase) * 0.08);
        polygonPath(ctx, HAIR_PATH);
        ctx.fillStyle = hairColor;
        ctx.fill();
        polygonPath(ctx, HAIR_HIGHLIGHT_PATH);
        ctx.fillStyle = hairHighlight;
        ctx.globalAlpha *= 0.5;
        ctx.fill();
        ctx.restore();
      }
    }

    _drawLongHair(ctx, hairColor, hairHighlight, now) {
      const sway = Math.sin(now * 1.6 + this.bobPhase) * 1.2;
      const topCy = HEAD_CY + 7;
      const strandBottom = SHOULDER_Y - 22;
      const strandTop = HEAD_CY + HEAD_R - 2;
      const strandLen = strandTop - strandBottom;
      const strandCy = (strandTop + strandBottom) / 2;
      drawRoundedRectLocal(ctx, 0, topCy, HEAD_R * 1.75, 9, 4.5, 0, hairColor, shade(hairColor, 0.6), 1);
      [-1, 1].forEach((side) => {
        drawRoundedRectLocal(ctx, side * 10.5 + sway * side * 0.4, strandCy, 5.5, strandLen, 2.75, side * 0.04, hairColor, shade(hairColor, 0.6), 1);
      });
      drawRoundedRectLocal(ctx, -10.5, strandCy, 1.8, strandLen - 6, 0.9, 0.04, hairHighlight, null, 0);
      drawRoundedRectLocal(ctx, 10.5, strandTop - 10, 8, 4, 1.5, 0.04, '#D9436B', '#8C2447', 1);
    }

    _swordSwingAngle(now) {
      if (this.attackAnimT < 0) return 0;
      const t = now - this.attackAnimT;
      if (t < 0.07) return 1.1 * (t / 0.07);
      if (t < 0.2) return 1.1 * (1 - (t - 0.07) / 0.13);
      return 0;
    }

    _drawVaderHead(ctx, flying) {
      drawEllipseLocal(ctx, 0, HEAD_CY + 3, HEAD_R * 1.5, 4, '#0A0A0C');
      drawEllipseLocal(ctx, 0, HEAD_CY, HEAD_R + 1.5, HEAD_R * 1.15, '#101014', '#000000', 1.5);
      drawRoundedRectLocal(ctx, 0, HEAD_CY - 2, HEAD_R * 1.35, HEAD_R * 0.95, 3, 0, '#1C1C22', '#000000', 1);
      drawEllipseLocal(ctx, -4.5, HEAD_CY + 2.5, 2.4, 1.7, flying ? 'rgba(230,30,20,0.9)' : '#B31212');
      drawEllipseLocal(ctx, 4.5, HEAD_CY + 2.5, 2.4, 1.7, flying ? 'rgba(230,30,20,0.9)' : '#B31212');
      drawRoundedRectLocal(ctx, 0, HEAD_CY - 8, 5, 3, 1, 0, '#3A3A40');

    _drawHeldItem(ctx, cfg, form, swingAngle) {

        ctx.clip();
        ctx.fillStyle = '#D32F2F';
        ctx.fillRect(0, -7, 7, 14);
        ctx.restore();
        ctx.strokeStyle = '#14141A';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, 7); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 7, -0.6, 0.6); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 7, Math.PI - 0.6, Math.PI + 0.6); ctx.stroke();

      } else if (cfg.heldItem === 'books') {

        drawRoundedRectLocal(ctx, 0, 0, 15, 5, 1, -0.12, '#FFD166', '#8A6A1F', 1);

      } else if (cfg.heldItem === 'lightsaber') {

    _drawLeg(ctx, cfg, xOffset, rotation) {

      drawRoundedRectLocal(ctx, xOffset, BOOT_H + LEG_H / 2, 12, LEG_H, 3, rotation, cfg.giColor, cfg.giStroke, 1.5);

    _drawArm(ctx, cfg, front, now) {
      const armOffset = front ? this._armOffset(now) : 0;

      if (front) {

  // ---------------------------------------------------------------------
  // Boss
  // ---------------------------------------------------------------------

  class Boss {
    constructor(config) {
      this.config = config;
      this.health = config.maxHealth;
      this.isDefeated = false;
      this.x = 0; this.y = 0;
      this.hitFlashT = -1;
      this.lungeT = -1;
      this.defeatT = -1;
      this.lastAttackTime = 0;
      this.slowedUntil = -1;
      this.attackDisabledUntil = -1;
      this.weakenedUntil = -1;
      this.damageMultiplier = 1;
      this._remoteTimeMap = {};
    }

    get healthFraction() { return this.health / this.config.maxHealth; }

    takeDamage(amount, now) {
      if (this.isDefeated) return;
      this.health = Math.max(0, this.health - amount);
      this.hitFlashT = now;
      if (this.health === 0) { this.isDefeated = true; this.defeatT = now; }
    }

    playAttackLunge(now) { this.lungeT = now; }

    serialize() {
      return {
        x: this.x, y: this.y, health: this.health, isDefeated: this.isDefeated,
        hitFlashT: this.hitFlashT, lungeT: this.lungeT, defeatT: this.defeatT
      };
    }

    applyRemote(state, localNow) {
      this.x = state.x; this.y = state.y; this.health = state.health; this.isDefeated = state.isDefeated;
      const remapField = (field) => {
        const raw = state[field];
        const prevRaw = this._remoteTimeMap[field + '_raw'];
        if (raw < 0) { this[field] = -1; this._remoteTimeMap[field + '_raw'] = raw; return; }
        if (raw !== prevRaw) {
          this._remoteTimeMap[field + '_raw'] = raw;
          this._remoteTimeMap[field + '_local'] = localNow;
        }
        this[field] = this._remoteTimeMap[field + '_local'] !== undefined ? this._remoteTimeMap[field + '_local'] : localNow;
      };
      remapField('hitFlashT');
      remapField('lungeT');
      remapField('defeatT');
    }

    _bodyScale(now) {
      let s = 1;
      if (this.lungeT >= 0) {
        const t = now - this.lungeT;
        if (t < 0.35) s = t < 0.15 ? 1 + 0.08 * (t / 0.15) : 1.08 - 0.08 * ((t - 0.15) / 0.2);
        else this.lungeT = -1;
      }
      return s;
    }

    _hitFlashAlpha(now) {
      if (this.hitFlashT < 0) return 1;
      const t = now - this.hitFlashT;
      const cycle = 0.13;
      if (t > cycle * 2) { this.hitFlashT = -1; return 1; }
      const local = t % cycle;
      return local < cycle * 0.4 ? 0.4 : 1.0;
    }

    draw(ctx, now, canvasH) {
      const cfg = this.config;
      ctx.save();
      ctx.translate(this.x, canvasH - this.y);
      ctx.scale(1, -1);
      ctx.scale(cfg.scale, cfg.scale);

      drawEllipseLocal(ctx, 0, 4, 65, 13, 'rgba(0,0,0,0.3)');

      let rotation = 0, alpha = 1;
      if (this.isDefeated) {
        const t = Math.min(1, (now - this.defeatT) / 0.5);
        rotation = (Math.PI / 2.2) * t;
        alpha = 1 - 0.65 * t;
      } else {
        const bob = Math.sin(now / 1.1 * Math.PI) * 5;
        ctx.translate(0, bob);
      }

      ctx.save();
      ctx.rotate(rotation);
      ctx.globalAlpha = alpha * this._hitFlashAlpha(now);
      const s = this._bodyScale(now);
      ctx.scale(s, s);

      drawEllipseLocal(ctx, 0, 95, 75, 60, cfg.bodyColor, shade(cfg.bodyColor, 0.55), 3);
      drawEllipseLocal(ctx, 0, 78, 45, 34, cfg.bellyColor);

      const spikeXs = [-40, -18, 5, 28, 48];
      spikeXs.forEach((x, i) => {
        const h = i % 2 === 0 ? 34 : 44;
        ctx.save();
        ctx.translate(x, 142);
        ctx.scale(h / 34, h / 34);
        polygonPath(ctx, SPIKE_PATH);
        ctx.fillStyle = shade(cfg.bodyColor, 0.65);
        ctx.fill();
        ctx.strokeStyle = shade(cfg.bodyColor, 0.4);
        ctx.lineWidth = 1.5 / (h / 34);
        ctx.stroke();
        ctx.restore();
      });

      [-1, 1].forEach((side) => {
        ctx.save();
        ctx.translate(side * 88, 90);
        drawRoundedRectLocal(ctx, 0, 0, 20, 46, 10, side * 0.3, cfg.bodyColor, shade(cfg.bodyColor, 0.55), 2);
        for (let f = 0; f < 3; f++) {
          ctx.save();
          ctx.rotate((f - 1) * 0.35);
          ctx.translate((f - 1) * 8, -20);
          ctx.scale(0.5, 0.5);
          polygonPath(ctx, SPIKE_PATH);
          ctx.fillStyle = '#D9D9CC';
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.25)';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
      });

      const eyeSclera = cfg.eyeSclera || '#FFFFFF';
      const eyePupil = cfg.eyePupil || '#B31A0D';
      [-1, 1].forEach((side) => {
        drawEllipseLocal(ctx, side * 26, 110, 16, 16, eyeSclera, 'rgba(0,0,0,0.2)', 1);
        drawEllipseLocal(ctx, side * 26 + side * 3, 110, 8, 8, eyePupil);
      });

      ctx.restore();

      if (!this.isDefeated && now < (this.attackDisabledUntil || -1)) {
        for (let i = 0; i < 3; i++) {
          const a = now * 3 + (i * Math.PI * 2) / 3;
          const sx = Math.cos(a) * 40, sy = 175 + Math.sin(a) * 10;
          drawEllipseLocal(ctx, sx, sy, 5, 5, '#FFE034', '#B89A10', 1);
        }
      }

      ctx.restore();
    }
  }

  // ---------------------------------------------------------------------
  // Virtual joystick / buttons
  // ---------------------------------------------------------------------

  class Joystick {
    constructor(cx, cy, radius) {
      this.cx = cx; this.cy = cy; this.radius = radius;
      this.knobX = cx; this.knobY = cy;
      this.activePointerId = null;
      this.dx = 0; this.dy = 0;
    }

    reposition(cx, cy) { this.cx = cx; this.cy = cy; this.knobX = cx; this.knobY = cy; }
    hitTest(x, y) { return dist(x, y, this.cx, this.cy) <= this.radius; }

    onPointerDown(id, x, y) {
      if (this.activePointerId !== null) return false;
      if (!this.hitTest(x, y)) return false;
      this.activePointerId = id;
      this._updateFromPoint(x, y);
      return true;
    }

    onPointerMove(id, x, y) {
      if (id !== this.activePointerId) return;
      this._updateFromPoint(x, y);
    }

    onPointerUp(id) {
      if (id !== this.activePointerId) return;
      this.activePointerId = null;
      this.knobX = this.cx; this.knobY = this.cy;
      this.dx = 0; this.dy = 0;
    }

    _updateFromPoint(x, y) {
      let ddx = x - this.cx, ddy = y - this.cy;
      const d = Math.min(Math.sqrt(ddx * ddx + ddy * ddy), this.radius);
      const angle = Math.atan2(ddy, ddx);
      this.knobX = this.cx + Math.cos(angle) * d;
      this.knobY = this.cy + Math.sin(angle) * d;
      if (d < 6) { this.dx = 0; this.dy = 0; }
      else { this.dx = Math.cos(angle); this.dy = -Math.sin(angle); }
    }

    draw(ctx) {
      drawEllipseLocal(ctx, this.cx, this.cy, this.radius, this.radius, 'rgba(255,255,255,0.15)', 'rgba(255,255,255,0.5)', 2);
      drawEllipseLocal(ctx, this.knobX, this.knobY, this.radius * 0.45, this.radius * 0.45, 'rgba(255,255,255,0.55)');
    }
  }

  class RoundButton {
    constructor(x, y, r, fill, label, fontScale) {
      this.x = x; this.y = y; this.r = r; this.fill = fill; this.label = label;
      this.fontScale = fontScale || 0.36;
    }
    hitTest(x, y) { return dist(x, y, this.x, this.y) <= this.r; }
    draw(ctx) {
      drawEllipseLocal(ctx, this.x, this.y, this.r, this.r, this.fill, '#FFFFFF', 2);
      ctx.save();
      ctx.font = `bold ${this.r * this.fontScale}px -apple-system, "Segoe UI", sans-serif`;
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.label, this.x, this.y);
      ctx.restore();
    }
  }

  function drawStatBar(ctx, x, y, w, h, fraction, color, alignRight) {
    const trackX = alignRight ? x - w : x;
    roundRectPath(ctx, trackX, y, w, h, h / 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    const innerW = Math.max(0.5, (w - 4) * clamp(fraction, 0, 1));
    const innerX = alignRight ? x - 2 - innerW : x + 2;
    roundRectPath(ctx, innerX, y + 2, innerW, h - 4, (h - 4) / 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  // ---------------------------------------------------------------------
  // Networking (PeerJS wrapper) — direct browser-to-browser, no server to host
  // ---------------------------------------------------------------------

  class NetworkManager {
    constructor() {
      this.peer = null;
      this.conn = null;
      this.role = null; // 'host' | 'client'
      this.onOpen = null;
      this.onMessage = null;
      this.onClose = null;
    }

    static available() {
      return typeof Peer !== 'undefined';
    }

    host(roomCode, callbacks) {
      this.role = 'host';
      Object.assign(this, callbacks);
      this.peer = new Peer('sayajinquest-' + roomCode);
      this.peer.on('connection', (conn) => {
        this.conn = conn;
        this._wireConn();
      });
      this.peer.on('error', (err) => { if (this.onError) this.onError(err); });
      return this.peer;
    }

    join(roomCode, callbacks) {
      this.role = 'client';
      Object.assign(this, callbacks);
      this.peer = new Peer();
      this.peer.on('open', () => {
        this.conn = this.peer.connect('sayajinquest-' + roomCode, { reliable: true });
        this._wireConn();
      });
      this.peer.on('error', (err) => { if (this.onError) this.onError(err); });
      return this.peer;
    }

    _wireConn() {
      this.conn.on('open', () => { if (this.onOpen) this.onOpen(); });
      this.conn.on('data', (data) => { if (this.onMessage) this.onMessage(data); });
      this.conn.on('close', () => { if (this.onClose) this.onClose(); });
    }

    send(msg) {
      if (this.conn && this.conn.open) this.conn.send(msg);
    }
  }

      this.pressedKeys = new Set();

      this._resize();
      window.addEventListener('resize', () => this._resize());

      canvas.addEventListener('pointerdown', (e) => this._onPointerDown(e));
      canvas.addEventListener('pointermove', (e) => this._onPointerMove(e));
      canvas.addEventListener('pointerup', (e) => this._onPointerUp(e));

      this._buildStage();

    }

    get biome() { return BIOMES[this.stageIndex]; }
    get isNetworked() { return this.mode === 'host' || this.mode === 'client'; }

    _resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      this.width = window.innerWidth;
      this.height = window.innerHeight;
      this.canvas.width = this.width * dpr;
      this.canvas.height = this.height * dpr;
      this.canvas.style.width = this.width + 'px';
      this.canvas.style.height = this.height + 'px';
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.groundTop = this.height * GROUND_HEIGHT_RATIO;
      if (this.joystick) this._buildControls();
    }

    // -- stage construction --------------------------------------------

    _buildStage() {
      const biome = this.biome;
      const bossCfg = BOSSES[this.stageIndex];
      const now0 = performance.now() / 1000;
      this.boss = new Boss(bossCfg);
      this.boss.x = this.width * 0.5;
      this.boss.y = this.groundTop * 0.62;
      this.boss.lastAttackTime = now0;

      this.minions = [];
      if (this.stageIndex === NETHER_STAGE_INDEX) {
        [this.width * 0.28, this.width * 0.72].forEach((mx) => {
          const m = new Boss(NETHER_MINION_CONFIG);
          m.x = mx; m.y = this.groundTop * 0.5;
          m.lastAttackTime = now0;
          this.minions.push(m);
        });
      } else if (this.stageIndex === DARK_STAGE_INDEX) {
        [[this.width * 0.28, ANIMATRONIC_BEAR_CONFIG], [this.width * 0.72, ANIMATRONIC_FOX_CONFIG]].forEach(([mx, cfg]) => {
          const m = new Boss(cfg);
          m.x = mx; m.y = this.groundTop * 0.5;
          m.lastAttackTime = now0;
          this.minions.push(m);
        });
      }

      this.chest = null;
      if (this.stageIndex === CHEST_STAGE_INDEX) {
        this.chest = {
          x: this.width * (Math.random() < 0.5 ? 0.24 : 0.76),
          y: this.groundTop * randRange(0.12, 0.2),
          opened: false
        };
      }

      this.temple = null;
      if (this.stageIndex === TEMPLE_STAGE_INDEX) {
        this.temple = {
          x: this.width * 0.35,
          y: this.groundTop * 0.75,
          activated: false
        };
      }

      this.healingShrine = null;
      if (this.stageIndex === HEAL_STAGE_INDEX) {
        this.healingShrine = {
          x: this.width * 0.65,
          y: this.groundTop * 0.7,
          activated: false
        };
      }

      this.sign = null;
      if (this.stageIndex === WATER_SIGN_STAGE_INDEX) {
        this.sign = {
          x: this.width * 0.7,
          y: this.groundTop * 0.7,
          activated: false
        };
      }

      this.flyChest = null;
      if (this.stageIndex === FLY_CHEST_STAGE_INDEX) {
        this.flyChest = {
          x: this.width * 0.3,
          y: this.groundTop * 0.15,
          opened: false
        };
      }

      this.camera = null;
      if (this.stageIndex === WORLD2_YOUTUBE_INDEX) {
        this.camera = {
          x: this.width * 0.3,
          y: this.groundTop * 0.15,
          opened: false
        };
      }

      this.fase8Pizzas = [];
      if (this.stageIndex === DARK_STAGE_INDEX) {
        [0.15, 0.35, 0.5, 0.65, 0.85].forEach((px, i) => {
          this.fase8Pizzas.push({ x: this.width * px, y: this.groundTop * (0.12 + (i % 3) * 0.08), opened: false });
        });
      }

      this.portal = null;
      this.poisonEffects = [];
      this.pendingFlyHits = [];
      const portalCfg = PORTAL_CONFIGS.find((p) => p.stageIndex === this.stageIndex);
      if (portalCfg) {
        this.portal = { x: this.width * portalCfg.px, y: this.groundTop * portalCfg.py, dragon: this.stageIndex === END_STAGE_INDEX };
      }

      this._farHillPath = this._makeHillPath(this.width, this.groundTop * 0.35);
      this._nearHillPath = this._makeHillPath(this.width, this.groundTop * 0.22);

      this._groundPatches = [];
      for (let i = 0; i < 18; i++) {
        this._groundPatches.push({
          x: randRange(0, this.width), y: randRange(0, this.groundTop * 0.9),
          w: randRange(30, 70), h: randRange(14, 26), lighter: Math.random() < 0.5
        });
      }

      this._grassTufts = [];
      for (let i = 0; i < biome.grassTuftCount; i++) {
        const x = randRange(0, this.width);
        const y = randRange(0, this.groundTop * 0.95);
        const tuftScale = randRange(0.6, 1.3);
        for (let s = 0; s < 3; s++) {
          const spread = (s - 1) * 3.5;
          this._grassTufts.push({
            x: x + spread, y,
            rot: randRange(-0.3, 0.3) + spread * 0.03,
            scale: tuftScale * randRange(0.85, 1.15),
            lighter: Math.random() < 0.5
          });
        }
      }

      const leafPalette = biome.treeLeafPalette;
      const baseAngles = [100, 220, 340];
      this._trees = [];
      [this.width * 0.22, this.width * 0.78].forEach((x) => {
        const trunkHeight = randRange(54, 68);
        const canopyCenterY = trunkHeight + 22;
        const clusters = [];
        const usedColors = [];
        for (let i = 0; i < 3; i++) {
          const angle = (baseAngles[i] + randRange(-18, 18)) * Math.PI / 180;
          const distFromCenter = randRange(15, 23);
          let color;
          do { color = leafPalette[Math.floor(Math.random() * leafPalette.length)]; }
          while (usedColors.includes(color) && usedColors.length < leafPalette.length);
          usedColors.push(color);
          clusters.push({
            x: Math.cos(angle) * distFromCenter,
            y: canopyCenterY + Math.sin(angle) * distFromCenter * 0.8,
            rx: randRange(12, 19),
            ry: randRange(10, 17),
            color
          });
        }
        this._trees.push({ x, y: this.groundTop * randRange(0.15, 0.3), trunkHeight, trunkColor: biome.treeTrunkColor, clusters, style: biome.treeStyle || 'round' });
      });

      this.lastRockThrowTime = now0;
      this.lastFishThrowTime = now0;
      this.lastPlaqueThrowTime = now0;
    }

    _makeHillPath(width, amplitude) {
      const segments = 6, segW = width / segments;
      const points = [[0, randRange(amplitude * 0.3, amplitude)]];
      let prev = points[0];
      for (let i = 1; i <= segments; i++) {
        const x = i * segW;
        const y = randRange(amplitude * 0.3, amplitude);
        points.push([x, y, (prev[0] + x) / 2, Math.max(prev[1], y) + amplitude * 0.3]);
        prev = [x, y];
      }
      return points;
    }

    _advanceStage() {
      const prevStageIndex = this.stageIndex;
      this.stageIndex++;
      if (this.stageIndex >= POST_FASE5_UNLOCK_INDEX) {
        for (const c of [this.miguel, this.tiago]) if (c.configKey === 'tiago') c.grantPostFase5Shield();
      }
      if (prevStageIndex === WORLD2_BARN_INDEX) {
        this.miguel.animalForm = null;
        this.tiago.animalForm = null;
        this.miguel.restoreFullHealth();
        this.tiago.restoreFullHealth();
      }
      if (this.stageIndex >= BIOMES.length) {
        this.stageIndex = BIOMES.length - 1;
        this.isGameComplete = true;
        this.audio.playVictoryTheme();
        try { localStorage.setItem(YOUTUBE_UNLOCK_KEY, '1'); } catch (e) { /* storage unavailable */ }
        this._youtubePowerUnlocked = true;
        return;
      }
      this._buildStage();
      this._placeCharacters();
      this.miguel.restoreFullHealth();
      this.tiago.restoreFullHealth();
      this._showBanner(`Fase ${this.stageIndex + 1}: ${this.biome.name}`, '#FFFFFF');
      this.audio.playVictoryJingle();
      if (this.stageIndex === WORLD2_BARN_INDEX) {
        this.animalSelectPending = true;
        this.animalSelectStage = 'p1';
      }
    }

      this.miguel = new Character(this._miguelCharacterKey || 'miguel');

    _localPoint(e) {
      const rect = this.canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    _characterFor(key) { return key === 'miguel' ? this.miguel : this.tiago; }

    _onPointerDown(e) {
      e.preventDefault();
      const p = this._localPoint(e);
      const now = performance.now() / 1000;

      if (this.animalSelectPending) {
        if (this.mode !== 'client' && this._animalButtonBounds) {
          const hit = (b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
          let chosen = null;
          if (hit(this._animalButtonBounds.vaca)) chosen = 'vaca';
          else if (hit(this._animalButtonBounds.gato)) chosen = 'gato';
          if (chosen) {
            const target = this.animalSelectStage === 'p1' ? this.miguel : this.tiago;
            target.animalForm = chosen;
            target.restoreFullHealth();
            if (this.animalSelectStage === 'p1') {
              this.animalSelectStage = 'p2';
            } else {
              this.animalSelectPending = false;
              this.animalSelectStage = null;
              this.boss.lastAttackTime = now;
              this.lastRockThrowTime = now;
              this.lastFishThrowTime = now;
              this.lastPlaqueThrowTime = now;
              for (const m of this.minions) m.lastAttackTime = now;
              this._showBanner('🐮🐱 Animais escolhidos! Enfrente o Touro!', '#FFD933');
            }
          }
        }
        return;
      }

      if (this.isGameComplete && this._victoryButtonBounds) {
        const b = this._victoryButtonBounds;
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
          this._resetGame();
          return;
        }
      }
      if (this.restartButton && this.restartButton.hitTest(p.x, p.y)) { this._resetGame(); return; }

      const buttons = [
        [this.powerButtonMiguel, 'miguel', 'power'], [this.powerButtonTiago, 'tiago', 'power'],
        [this.attackButtonMiguel, 'miguel', 'attack'], [this.attackButtonTiago, 'tiago', 'attack'],
        [this.specialButtonMiguel, 'miguel', 'special'], [this.specialButtonTiago, 'tiago', 'special'],
        [this.blastButtonMiguel, 'miguel', 'blast'], [this.blastButtonTiago, 'tiago', 'blast'],
        [this.healButtonMiguel, 'miguel', 'heal'], [this.healButtonTiago, 'tiago', 'heal'],
        [this.waterButtonMiguel, 'miguel', 'water'], [this.waterButtonTiago, 'tiago', 'water'],
        [this.flyButtonMiguel, 'miguel', 'fly'], [this.flyButtonTiago, 'tiago', 'fly'],
        [this.tempoButtonMiguel, 'miguel', 'tempo'], [this.tempoButtonTiago, 'tiago', 'tempo'],
        [this.iceButtonMiguel, 'miguel', 'ice'], [this.iceButtonTiago, 'tiago', 'ice'],
        [this.giftButtonMiguel, 'miguel', 'gift'], [this.giftButtonTiago, 'tiago', 'gift'],
        [this.pizzaButtonMiguel, 'miguel', 'pizza'], [this.pizzaButtonTiago, 'tiago', 'pizza'],
        [this.slowButtonMiguel, 'miguel', 'slow'], [this.slowButtonTiago, 'tiago', 'slow'],
        [this.teamHealButtonMiguel, 'miguel', 'teamheal'], [this.teamHealButtonTiago, 'tiago', 'teamheal'],
        [this.extra1ButtonMiguel, 'miguel', 'extra1'], [this.extra1ButtonTiago, 'tiago', 'extra1'],
        [this.extra2ButtonMiguel, 'miguel', 'extra2'], [this.extra2ButtonTiago, 'tiago', 'extra2'],
        [this.pushButtonMiguel, 'miguel', 'push'], [this.pushButtonTiago, 'tiago', 'push'],
        [this.bossControlButtonMiguel, 'miguel', 'bossControl'], [this.bossControlButtonTiago, 'tiago', 'bossControl'],
        [this.videoFreezeButtonMiguel, 'miguel', 'videoFreeze'], [this.videoFreezeButtonTiago, 'tiago', 'videoFreeze']
      ];
      for (const [btn, key, action] of buttons) {
        if (btn && btn.hitTest(p.x, p.y)) {
          const character = this._characterFor(key);
          if (action === 'special' && !character.hasSpecialPower) continue;
          if (action === 'blast' && !character.hasEnergyBlast) continue;
          if (action === 'heal' && !character.hasHeal) continue;
          if (action === 'water' && !character.hasWaterGun) continue;
          if (action === 'fly' && !character.hasFlyAttack) continue;
          if (action === 'tempo') {
            const t = character.tempoPowerType;
            if (t !== 'halfLife' && t !== 'fire' && t !== 'poison') continue;
          }
          if (action === 'ice' && !character.hasIceAttack) continue;
          if (action === 'gift' && !character.canUseGift()) continue;
          if (action === 'pizza' && !character.hasPizzaPower) continue;
          if (action === 'slow' && !character.hasSlowAttack) continue;
          if (action === 'teamheal' && !character.hasTeamHeal) continue;
          if (action === 'push' && !character.hasPushAttack) continue;
          if (action === 'bossControl' && !character.canUseBossControl()) continue;
          if (action === 'videoFreeze' && !character.canUseVideoFreeze()) continue;
          let realAction = action;
          if (action === 'extra1' || action === 'extra2') {
            const extras = CHARACTER_EXTRA_ACTIONS[character.configKey];
            realAction = extras ? (action === 'extra1' ? extras.extra1 : extras.extra2) : null;
            if (!realAction || !canUseExtraAction(character, realAction)) continue;
          }
          this._triggerAction(key, realAction, now);
          return;
        }
      }
      if (this.musicButton.hitTest(p.x, p.y)) { this._cycleMusic(); return; }

      if (this.mode === 'local') {
        if (this.joystickMiguel.onPointerDown(e.pointerId, p.x, p.y)) return;
        if (this.joystickTiago.onPointerDown(e.pointerId, p.x, p.y)) return;
      } else if (this.joystick) {
        this.joystick.onPointerDown(e.pointerId, p.x, p.y);
      }
    }

    _onPointerMove(e) {
      const p = this._localPoint(e);
      if (this.mode === 'local') {
        this.joystickMiguel.onPointerMove(e.pointerId, p.x, p.y);
        this.joystickTiago.onPointerMove(e.pointerId, p.x, p.y);
      } else if (this.joystick) {
        this.joystick.onPointerMove(e.pointerId, p.x, p.y);
      }
    }

    _onPointerUp(e) {
      if (this.mode === 'local') {
        this.joystickMiguel.onPointerUp(e.pointerId);
        this.joystickTiago.onPointerUp(e.pointerId);
      } else if (this.joystick) {
        this.joystick.onPointerUp(e.pointerId);
      }
    }

    _triggerAction(key, action, now) {
      if (this.mode === 'client') {
        this.net.send({ t: 'action', key, action });
        return;
      }
      this._applyAction(key, action, now);
    }

    _applyAction(key, action, now) {
      const character = this._characterFor(key);
      if (character.isStunned(now)) return;
      if (action === 'power') { character.chargePower(now); this.audio.playPowerBlip(); }
      else if (action === 'attack') this._handleAttack(character, now);
      else if (action === 'special') this._handleSpecial(character, now);
      else if (action === 'blast') this._handleBlast(character, now);
      else if (action === 'heal') this._handleHeal(character, now);
      else if (action === 'water') this._handleWater(character, now);
      else if (action === 'fly') this._handleFly(character, now);
      else if (action === 'tempo') this._handleTempoAction(character, now);
      else if (action === 'ice') this._handleIce(character, now);
      else if (action === 'gift') this._handleGift(character, now);
      else if (action === 'pizza') this._handlePizza(character, now);
      else if (action === 'slow') this._handleSlow(character, now);
      else if (action === 'teamheal') this._handleTeamHeal(character, now);
      else if (action === 'catSummon') this._handleCatSummon(character, now);
      else if (action === 'yellowBall') this._handleYellowBall(character, now);
      else if (action === 'spinAttack') this._handleSpinAttack(character, now);
      else if (action === 'weakenSelf') this._handleWeakenSelf(character, now);
      else if (action === 'tigerBlind') this._handleTigerBlind(character, now);
      else if (action === 'speedBurst') this._handleSpeedBurst(character, now);
      else if (action === 'flyDebuff') this._handleFlyDebuff(character, now);
      else if (action === 'fase8Shield') this._handleFase8Shield(character, now);
      else if (action === 'bookFly') this._handleFly(character, now);
      else if (action === 'puzzleWhirl') this._handlePuzzleWhirl(character, now);
      else if (action === 'saberThrow') this._handleSaberThrow(character, now);
      else if (action === 'vaderFreeze') this._handleVaderFreeze(character, now);
      else if (action === 'push') this._handlePush(character, now);
      else if (action === 'bossControl') this._handleBossControl(character, now);
      else if (action === 'videoFreeze') this._handleVideoFreeze(character, now);
    }

    _nearestEnemyTarget() {
      const aliveMinions = this.minions.filter((m) => !m.isDefeated);
      if (aliveMinions.length > 0) return aliveMinions[0];
      return this.boss.isDefeated ? null : this.boss;
    }

    _handleAttack(character, now) {
      if (!character.canAttack()) return;
      const damage = character.performAttack(now);
      this.audio.playAttackBlip();
      const target = this._nearestEnemyTarget();
      if (character.config.heldItem === 'books' || character.config.heldItem === 'basketball') {
        this.projectiles.push({
          id: this._nextProjectileId++,
          kind: character.config.heldItem === 'books' ? 'book' : 'ball',
          ownerKey: character.configKey,
          fromX: character.x, fromY: character.y + 30,
          toX: target ? target.x : character.x + (character.facingRight ? 60 : -60), toY: target ? target.y + 10 : character.y + 20,
          duration: 0.3,
          damage: 0,
          applied: true,
          localStartT: now
        });
      }
      if (!target) return;
      if (dist(character.x, character.y, target.x, target.y) <= target.config.attackRange) {
        target.takeDamage(damage, now);
      }
    }

    _handleSpecial(character, now) {
      if (!character.canUseSpecial()) return;
      character.performSpecialAttack(now);
      this.audio.playSpecialBlip();
      const target = this._nearestEnemyTarget();
      if (!target) return;
      if (dist(character.x, character.y, target.x, target.y) <= target.config.attackRange) {
        target.takeDamage(Math.max(1, Math.round(target.health / 2)), now);
      }
    }

    _handleBlast(character, now) {
      if (!character.canUseBlast()) return;
      const damage = character.performEnergyBlast(now);
      this.audio.playBlastBlip();
      const target = this._nearestEnemyTarget();
      this.projectiles.push({
        id: this._nextProjectileId++,
        kind: 'ki',
        ownerKey: character.configKey,
        fromX: character.x, fromY: character.y + 34,
        toX: target ? target.x : this.boss.x, toY: target ? target.y + 10 : this.boss.y + 10,
        duration: 0.4,
        damage,
        applied: false,
        localStartT: now
      });
    }

    _handleWater(character, now) {
      if (!character.canUseWater()) return;
      const damage = character.performWaterBlast(now);
      this.audio.playWaterBlip();
      const target = this._nearestEnemyTarget();
      this.projectiles.push({
        id: this._nextProjectileId++,
        kind: 'water',
        ownerKey: character.configKey,
        fromX: character.x, fromY: character.y + 34,
        toX: target ? target.x : this.boss.x, toY: target ? target.y + 10 : this.boss.y + 10,
        duration: 0.4,
        damage,
        applied: false,
        localStartT: now
      });
    }

    _handleHeal(character, now) {
      if (!character.canUseHeal()) return;
      character.performHeal(now);
      this.audio.playHealChime();
    }

    _handleFly(character, now) {
      if (!character.canUseFly()) return;
      const damage = character.performFlyAttack(now);
      this.audio.playSpecialBlip();
      const target = this._nearestEnemyTarget();
      if (!target) return;
      character.flyTargetX = target.x;
      character.flyTargetY = target.y;
      character.flyAnimT = now;
      this.pendingFlyHits.push({ target, damage, applyAt: now + FLY_ANIM_DURATION / 2, applied: false });
    }

    _updatePendingFlyHits(now) {
      for (const h of this.pendingFlyHits) {
        if (!h.applied && now >= h.applyAt) {
          h.applied = true;
          if (!h.target.isDefeated) {
            h.target.takeDamage(h.damage, now);
            this.audio.playHitImpact();
          }
        }
      }
      this.pendingFlyHits = this.pendingFlyHits.filter((h) => !h.applied);
    }

    _isGameKey(key) {
      for (const b of Object.values(KEY_BINDINGS)) {
        if (Object.values(b).includes(key)) return true;
      }
      return false;
    }

    _keySetActiveFor(charKey) {
      if (this.mode === 'local') return true;
      return this.localKey === charKey;
    }

    _keyboardVector(charKey) {
      if (!this._keySetActiveFor(charKey)) return { dx: 0, dy: 0 };
      const b = KEY_BINDINGS[charKey];
      let dx = 0, dy = 0;
      if (this.pressedKeys.has(b.left)) dx -= 1;
      if (this.pressedKeys.has(b.right)) dx += 1;
      if (this.pressedKeys.has(b.up)) dy += 1;
      if (this.pressedKeys.has(b.down)) dy -= 1;
      if (dx !== 0 && dy !== 0) { const inv = 1 / Math.sqrt(2); dx *= inv; dy *= inv; }
      return { dx, dy };
    }

    _onKeyDown(e) {
      const key = e.key.toLowerCase();
      if (this._isGameKey(key)) e.preventDefault();
      if (this.pressedKeys.has(key)) return;
      this.pressedKeys.add(key);
      if (this.animalSelectPending) return;
      const now = performance.now() / 1000;
      for (const charKey of ['miguel', 'tiago']) {
        if (!this._keySetActiveFor(charKey)) continue;
        const b = KEY_BINDINGS[charKey];
        if (key === b.attack) this._triggerAction(charKey, 'attack', now);
        else if (key === b.power) this._triggerAction(charKey, 'power', now);
        else if (key === b.special && this._characterFor(charKey).hasSpecialPower) this._triggerAction(charKey, 'special', now);
        else if (key === b.blast && this._characterFor(charKey).hasEnergyBlast) this._triggerAction(charKey, 'blast', now);
        else if (key === b.heal && this._characterFor(charKey).hasHeal) this._triggerAction(charKey, 'heal', now);
        else if (key === b.water && this._characterFor(charKey).hasWaterGun) this._triggerAction(charKey, 'water', now);
        else if (key === b.fly && this._characterFor(charKey).hasFlyAttack) this._triggerAction(charKey, 'fly', now);
        else if (key === b.tempo) {
          const t = this._characterFor(charKey).tempoPowerType;
          if (t === 'halfLife' || t === 'fire' || t === 'poison') this._triggerAction(charKey, 'tempo', now);
        }
        else if (key === b.ice && this._characterFor(charKey).hasIceAttack) this._triggerAction(charKey, 'ice', now);
        else if (key === b.gift && this._characterFor(charKey).canUseGift()) this._triggerAction(charKey, 'gift', now);
        else if (key === b.pizza && this._characterFor(charKey).hasPizzaPower) this._triggerAction(charKey, 'pizza', now);
        else if (key === b.slow && this._characterFor(charKey).hasSlowAttack) this._triggerAction(charKey, 'slow', now);
        else if (key === b.teamheal && this._characterFor(charKey).hasTeamHeal) this._triggerAction(charKey, 'teamheal', now);
        else if (key === b.extra1 || key === b.extra2) {
          const character = this._characterFor(charKey);
          const extras = CHARACTER_EXTRA_ACTIONS[character.configKey];
          const actionName = extras ? (key === b.extra1 ? extras.extra1 : extras.extra2) : null;
          if (actionName && canUseExtraAction(character, actionName)) this._triggerAction(charKey, actionName, now);
        }
        else if (key === b.push && this._characterFor(charKey).hasPushAttack) this._triggerAction(charKey, 'push', now);
        else if (key === b.bossControl && this._characterFor(charKey).canUseBossControl()) this._triggerAction(charKey, 'bossControl', now);
        else if (key === b.videoFreeze && this._characterFor(charKey).canUseVideoFreeze()) this._triggerAction(charKey, 'videoFreeze', now);
      }
    }

    _onKeyUp(e) {
      this.pressedKeys.delete(e.key.toLowerCase());
    }

    _cycleMusic() {
      this.currentTrackIndex = (this.currentTrackIndex + 1) % MUSIC_TRACKS.length;
      const track = MUSIC_TRACKS[this.currentTrackIndex];
      this.audio.playTrack(this.currentTrackIndex);
      this._showBanner('♪ ' + track.name, '#FFFFFF');
    }

    // -- networking messages --------------------------------------------

    _onNetMessage(msg) {
      if (this.mode === 'host') {
        if (msg.t === 'input') { this.remoteInput.dx = msg.dx; this.remoteInput.dy = msg.dy; }
        else if (msg.t === 'action') { this.pendingRemoteActions.push(msg); }
      } else if (this.mode === 'client') {
        if (msg.t === 'state') this._applyHostState(msg, performance.now() / 1000);
      }
    }

    _applyHostState(msg, localNow) {
      this.miguel.applyRemote(msg.miguel, localNow);
      this.tiago.applyRemote(msg.tiago, localNow);
      this.chest = msg.chest;
      this.temple = msg.temple;
      this.healingShrine = msg.healingShrine;
      this.sign = msg.sign;
      this.flyChest = msg.flyChest;
      this.fase8Pizzas = msg.fase8Pizzas;
      this._syncRemoteProjectiles(msg.projectiles || [], localNow);
      if (msg.stageIndex !== this.stageIndex) {
        this.stageIndex = msg.stageIndex;
        this._buildStage_visualOnly();
      }
      if (msg.inTempo !== this.inTempo || (msg.inTempo && (!this.tempoConfig || this.tempoConfig.stageIndex !== msg.tempoStageIndex))) {
        this.inTempo = msg.inTempo;
        this.tempoConfig = msg.inTempo ? PORTAL_CONFIGS.find((p) => p.stageIndex === msg.tempoStageIndex) : null;
        if (msg.inTempo && this.tempoConfig && this.tempoConfig.multiItem) {
          this.tempoPizza = { x: this.width * 0.32, y: this.groundTop * 0.5, opened: !!msg.tempoPizzaOpened };
          this.tempoWaterCup = { x: this.width * 0.5, y: this.groundTop * 0.5, opened: !!msg.tempoWaterCupOpened };
          this.tempoChest = { x: this.width * 0.68, y: this.groundTop * 0.5, opened: !!msg.tempoChestOpened };
        } else {
          this.tempoChest = msg.inTempo ? { x: this.width * 0.5, y: this.groundTop * 0.5, opened: !!msg.tempoChestOpened } : null;
          this.tempoPizza = null;
          this.tempoWaterCup = null;
        }
      } else if (this.tempoConfig && this.tempoConfig.multiItem) {
        if (this.tempoPizza) this.tempoPizza.opened = !!msg.tempoPizzaOpened;
        if (this.tempoWaterCup) this.tempoWaterCup.opened = !!msg.tempoWaterCupOpened;
        if (this.tempoChest) this.tempoChest.opened = !!msg.tempoChestOpened;
      } else if (this.tempoChest) {
        this.tempoChest.opened = !!msg.tempoChestOpened;
      }
      this.boss.applyRemote(msg.boss, localNow);
      if (msg.minions) {
        msg.minions.forEach((ms, i) => { if (this.minions[i]) this.minions[i].applyRemote(ms, localNow); });
      }
      if (this.isGameComplete && !msg.isGameComplete) this.audio.playTrack(this.currentTrackIndex);
      else if (!this.isGameComplete && msg.isGameComplete) this.audio.playVictoryTheme();
      this.isGameComplete = msg.isGameComplete;
      this.animalSelectPending = !!msg.animalSelectPending;
      this.animalSelectStage = msg.animalSelectStage || null;
      this.camera = msg.camera;
      if (msg.bannerText && msg.bannerText !== this._lastBannerText) {
        this._lastBannerText = msg.bannerText;
        this._showBanner(msg.bannerText, msg.bannerColor || '#fff');
      }
    }

    _syncRemoteProjectiles(list, localNow) {
      if (!this._remoteProjectileTimeMap) this._remoteProjectileTimeMap = {};
      const seen = new Set();
      for (const p of list) {
        seen.add(p.id);
        if (this._remoteProjectileTimeMap[p.id] === undefined) {
          this._remoteProjectileTimeMap[p.id] = localNow;
        }
      }
      for (const id of Object.keys(this._remoteProjectileTimeMap)) {
        if (!seen.has(Number(id))) delete this._remoteProjectileTimeMap[id];
      }
      this.projectiles = list.map((p) => ({ ...p, localStartT: this._remoteProjectileTimeMap[p.id] }));
    }

    _buildStage_visualOnly() {
      const savedChest = this.chest;
      const savedTemple = this.temple;
      const savedHealingShrine = this.healingShrine;
      const savedSign = this.sign;
      const savedFlyChest = this.flyChest;
      const savedFase8Pizzas = this.fase8Pizzas;
      const savedCamera = this.camera;
      this._buildStage();
      this.chest = savedChest;
      this.temple = savedTemple;
      this.healingShrine = savedHealingShrine;
      this.sign = savedSign;
      this.flyChest = savedFlyChest;
      this.fase8Pizzas = savedFase8Pizzas;
      this.camera = savedCamera;
    }

    _broadcastState() {
      this.net.send({
        t: 'state',
        miguel: this.miguel.serialize(),
        tiago: this.tiago.serialize(),
        boss: this.boss.serialize(),
        minions: this.minions.map((m) => m.serialize()),
        chest: this.chest,
        temple: this.temple,
        healingShrine: this.healingShrine,
        sign: this.sign,
        flyChest: this.flyChest,
        fase8Pizzas: this.fase8Pizzas,
        camera: this.camera,
        animalSelectPending: this.animalSelectPending,
        animalSelectStage: this.animalSelectStage,
        inTempo: this.inTempo,
        tempoStageIndex: this.tempoConfig ? this.tempoConfig.stageIndex : null,
        tempoChestOpened: this.tempoChest ? this.tempoChest.opened : null,
        tempoPizzaOpened: this.tempoPizza ? this.tempoPizza.opened : null,
        tempoWaterCupOpened: this.tempoWaterCup ? this.tempoWaterCup.opened : null,
        projectiles: this.projectiles.map((p) => ({
          id: p.id, kind: p.kind, ownerKey: p.ownerKey, targetCharKey: p.targetCharKey,
          fromX: p.fromX, fromY: p.fromY, toX: p.toX, toY: p.toY, duration: p.duration
        })),
        stageIndex: this.stageIndex,
        isGameComplete: this.isGameComplete,
        bannerText: this.banner.start > (performance.now() / 1000 - this.banner.duration) ? this.banner.text : null,
        bannerColor: this.banner.color
      });
    }

    // -- update / render loop -------------------------------------------

    _loop(tMs) {
      const now = tMs / 1000;
      const dt = this.lastTime ? Math.min(0.05, now - this.lastTime) : 0;
      this.lastTime = now;

      this._update(dt, now);
      this._render(now);

      requestAnimationFrame((t) => this._loop(t));
    }

    _update(dt, now) {
      if (dt <= 0) return;
      if (this.animalSelectPending) return;

      if (this.mode === 'local') {
        this._updateLocalPlayer(this.miguel, this.joystickMiguel, dt, 'miguel', now);
        this._updateLocalPlayer(this.tiago, this.joystickTiago, dt, 'tiago', now);
        this._clampCharacters();
        if (this.inTempo) {
          this._updateTempoChest(now);
          this._updatePendingFlyHits(now);
        } else {
          this._updateEnemyMovement(this.boss, dt, now);
          for (const m of this.minions) this._updateEnemyMovement(m, dt, now);
          this._updateBossAI(now);
          this._updateChest(now);
          this._updateTemple(now);
          this._updateHealingShrine(now);
          this._updateSign(now);
          this._updateFlyChest(now);
          this._updateFase8Pizzas(now);
          this._updateCamera(now);
          this._updateCatSummon(now);
          this._updatePortal(now);
          this._updateStageProgress(now);
          this._updatePoisonEffects(now);
          this._updatePendingFlyHits(now);
        }
        this._updateProjectiles(now);
      } else if (this.mode === 'host') {
        const localChar = this._characterFor(this.localKey);
        const remoteKey = this.localKey === 'miguel' ? 'tiago' : 'miguel';
        const remoteChar = this._characterFor(remoteKey);

        if (this.joystick) this._updateLocalPlayer(localChar, this.joystick, dt, this.localKey, now);
        const remoteLocked = remoteChar.isAttackLocked(now) || remoteChar.isStunned(now);
        remoteChar.setMoving(!remoteLocked && (this.remoteInput.dx !== 0 || this.remoteInput.dy !== 0));
        if (!remoteLocked) remoteChar.move(this.remoteInput.dx, this.remoteInput.dy, dt);
        remoteChar.updateTimers(dt);

        for (const action of this.pendingRemoteActions) this._applyAction(action.key, action.action, now);
        this.pendingRemoteActions.length = 0;

        this._clampCharacters();
        if (this.inTempo) {
          this._updateTempoChest(now);
          this._updatePendingFlyHits(now);
        } else {
          this._updateEnemyMovement(this.boss, dt, now);
